function award(state,base){
 const recovery=Math.min(state.debt,Math.ceil(base*.65));
 state.debt-=recovery;
 state.coins+=base+recovery;
 return {gain:base+recovery,recovery};
}
function incorrect(state){
 const i=state.level-1, start=state.scores[i];
 if(state.wrongStreak===0)state.missedAt=start;
 state.wrongStreak++;
 if(start<100)state.scores[i]=Math.max(0,start-12);
 state.check=0;
 let charge=0;
 if(state.wrongStreak>=2){
  const rate=state.debt>=10?1:state.missedAt>=80?8:3;
  charge=Math.min(state.coins,rate);
  state.coins-=charge;
  state.debt+=charge;
 }
 return {charge,scoreLoss:start-state.scores[i]};
}
function correct(state,checkpoint){
 const i=state.level-1,start=state.scores[i],base=state.smelter?8:state.pickaxe?6:5;
 const payment=award(state,base);
 state.wrongStreak=0;
 let unlocked=false;
 if(checkpoint){
  state.check++;
  if(state.check===3){
   state.scores[i]=100;
   state.check=0;
   if(state.level===state.unlocked&&state.level<12){state.unlocked++;unlocked=true;}
  }
 }else if(start<95){
  const won=state.counts[i],increment=start>=80?3:start>=68?6:[12,8,7,6][won]??8;
  state.scores[i]=Math.min(95,start+increment);
 }
 if(!checkpoint)state.counts[i]++;
 return {...payment,points:state.scores[i]-start,unlocked};
}

function canTrade(state){return !state.paused;}
function sale(state){
 if(!canTrade(state)||state.bars<1)return 0;
 const coins=state.bars*8;
 state.sales+=state.bars;
 state.coins+=coins;
 state.bars=0;
 return coins;
}
function factoryTick(state){
 if(state.paused||!state.hired)return false;
 if(!state.smelter||!state.pickaxe)return false;
 if(state.ore>=2){
  state.ore-=2;state.bars++;
  if(state.manager===0&&state.ticks%2===0)state.ore++;
  if(state.manager===2)sale(state);
 }else state.ore+=state.manager===1?2:1;
 state.ticks++;
 if(state.ticks>=6){state.ticks=0;state.paused=true;}
 return true;
}

function offlineCoach(reply){

 const hasFuture=/\b(tomorrow|next (day|week)|will)\b/i.test(reply);
 const errors=[
 [/\b(yesterday,?\s+i\s+)(mine|wash|sort|load|pack|move|check|count|work)\b/gi,'ed'],
 [/\b(will\s+)(mined|washed|sorted|loaded|packed|moved|checked|counted|worked)\b/gi,'remove']
 ];
 let improved=reply.trim().replace(/(^\s*[a-z])|\bi\b/g,c=>c.toUpperCase());
 const regular={mine:'mined',wash:'washed',sort:'sorted',load:'loaded',pack:'packed',move:'moved',check:'checked',count:'counted',work:'worked'};
 improved=improved.replace(errors[0][0],(_,start,verb)=>start+regular[verb.toLowerCase()]);
 improved=improved.replace(errors[1][0],(_,start,verb)=>start+Object.keys(regular).find(k=>regular[k]===verb.toLowerCase()));
 const tense=!hasPast||!hasFuture?'Include both actions. Use a past-tense verb with “yesterday,” and “will” plus the base verb for tomorrow.'
  :'Check that your yesterday verb is in the past tense and the verb after “will” is in its base form.';
 return {improved,tense,vocabulary:'Try a precise action such as “sorted the ore,” “smelted the copper,” or “packed the bars.”',
  modelAnswer:'Yesterday I sorted the copper ore. Tomorrow I will load it into the smelter.'};

   method:'POST',credentials:'omit',redirect:'error',headers:{'Content-Type':'application/json'},
   signal:controller.signal,body:JSON.stringify({model,stream:false,format:schema,
    messages:[{role:'system',content:system},{role:'user',content:prompt}],options:{temperature:.4,num_predict:280}})
  });
  if(!response.ok)throw Error('Ollama is unavailable.');

 }finally{

  for(let j=0;j<900;j++){
   const x=-43+random()*86,z=-14+random()*135,y=floorY(x,z),s=.17+random()*.68;
   if(y<.26||Math.abs(x-pathCenter(z))<1.8)continue;
   put(near,j%5?'leaf':'rock',x,y+s*.14,z,s,s*(j%5?1.03:.65),s,j%5?'#789d58':'#97967a',random()*.55,j*.4);
  }
  for(const [x,z,s] of [[-4,9,1.75],[-5.6,9.7,1],[-4.2,11,.64]]){
   const y=floorY(x,z);
   put(near,'rock',x,y+s*.44,z,s*1.53,s*1.46,s*1.56,'#777e70',.05,.85);
   for(let j=0;j<8;j++)put(near,'rock',x+Math.sin(j*2.39)*s*.62,y+s*(.57+.18*Math.cos(j)),z+Math.cos(j*2.39)*s*.64,s*.37,s*.22,s*.25,'#bb8b5f',.72,j);
  }
  for(let x=-20;x<-2;x+=.55){
   const z=23;put(near,'block',x,1.35,z,.51,.14,2.05,'#a58b60');
  }
  outdoor.add(meshes(near));scene.add(outdoor);
  let house=null, houseLocation='';
  function decorate(){
   const site=state.office?.site||'';
   if(site===houseLocation)return;
   houseLocation=site;
   if(house){
    outdoor.remove(house);
    house.traverse(o=>{if(o.isInstancedMesh){o.dispose();o.material.dispose();}});
   }
   if(!site)return;
   const x=site==='Palm Terrace'?-11:11,z=x<0?18:27,y=floorY(x,z), b={};
   put(b,'block',x,y+.1,z,5.45,.27,4.6,'#866448');
   put(b,'block',x,y+1.4,z+2.2,5.4,2.6,.18,'#c5ac7d');
   for(const d of [-1,1]){
    put(b,'block',x+d*2.6,y+1.4,z,.2,2.6,4.4,'#cdb88c');
    put(b,'block',x+d*1.65,y+1.4,z-2.2,1.9,2.6,.18,'#b9a379');
    put(b,'block',x+d*1.33,y+2.75,z,3.21,.19,5.1,'#4d7358',0,0,-d*.24);
   }
   house=meshes(b);outdoor.add(house);
  }
  const b={};
  put(b,'block',0,-.115,0,10,.215,9,'#a58a63');
  put(b,'block',0,1.37,4.43,10,2.75,.16,'#d0bb94');
  for(const d of [-1,1]){
   put(b,'block',d*4.92,1.37,0,.17,2.75,9,'#cbb58c');
   put(b,'block',d*3,1.37,-4.43,3.8,2.75,.16,'#c4aa7c');
  }
  for(let j=-4;j<=4;j++)put(b,'block',j,.006,0,.012,.01,9,'#7f6a4e');
  function desk(x,z,w){
   put(b,'block',x,.83,z,w,.13,1.13,'#8f6745');
   for(const d of [-1,1])put(b,'block',x+d*(w*.415),.38,z,.16,.79,.93,'#72533c');
  }
  desk(0,2.4,3.1);desk(-3.6,2.45,2.1);desk(3.6,2.45,2.1);
  put(b,'block',0,1.36,2.59,1.29,.76,.11,'#273d37');
  put(b,'block',0,1.36,2.529,1.13,.61,.034,'#557d68');
  put(b,'block',0,1.03,2.6,.16,.32,.11,'#334f46');
  put(b,'block',0,.9,2.1,.68,.025,.27,'#d4c8a9');
  for(let j=0;j<5;j++)put(b,'block',-3.56,.911+j*.017,2.42,.46,.013,.6,'#e7dab7',0,j*.058);
  put(b,'block',-3.2,1.63,4.31,2.34,1.09,.09,'#779b88');
  put(b,'block',3.45,1.57,4.31,2.22,1.13,.12,'#466a56');
  const roomScene=meshes(b);roomScene.visible=false;scene.add(roomScene);
  const room={x:0,z:-2.3,angle:0};
  world3={draw(){
   decorate();outdoor.visible=!indoors;roomScene.visible=indoors;
   const w=canvas.clientWidth||800,h=canvas.clientHeight||500;
   if(eye.aspect!==w/h||canvas._width!==w){renderer.setSize(w,h,false);eye.aspect=w/h;eye.updateProjectionMatrix();canvas._width=w;}
   const player=indoors?room:camera;
   eye.position.set(player.x,indoors?1.57:Math.max(-.15,floorY(player.x,player.z))+1.66,-player.z);
   eye.rotation.set(-.07,-player.angle,0,'YXZ');
   renderer.render(scene,eye);
   if(indoors){$('near').hidden=false;$('near').textContent='E · Office computer';}
   else if(state.office&&Math.hypot(camera.x-(state.office.site==='Palm Terrace'?-11:11),camera.z-(state.office.site==='Palm Terrace'?16:25))<3){
    $('near').hidden=false;$('near').textContent='E · Field office';
   }else{
    nearest=stations.map(o=>({o,d:Math.hypot(o.x-camera.x,o.z-camera.z)})).sort((a,b)=>a.d-b.d)[0];
    $('near').hidden=nearest.d>3.15;$('near').textContent='E · '+nearest.o.name;
   }
  },room};
 }catch(e){canvas.hidden=true;console.info('Illustrated clearing enabled.',e.message);}
}
