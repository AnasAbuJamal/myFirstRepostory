name: LumenVale Academic Gameplay Smoke Test
on:
  push:
    branches:
      - market-office-first-person
      - gamedev-skills-polish-2026-11-23
  workflow_dispatch:

jobs:
  teacher-typecheck:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Teacher Studio dependencies
        run: npm install --no-package-lock --prefix teacher
      - name: Typecheck teacher-generated course tools
        run: npm run lint --prefix teacher

  academic-smoke:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build single-file game
        run: python3 market/build.py --output dist/index.html
      - name: Verify distributed HTML matches current source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess,sys,os
          generated=Path('dist/index.html').read_bytes()
          committed=subprocess.check_output(['git','show','HEAD:dist/index.html'])
          if generated!=committed:
           i=next((n for n,(a,b) in enumerate(zip(generated,committed)) if a!=b),min(len(generated),len(committed)))
           print('Outdated dist/index.html: difference at byte',i)
           print('Generated:',repr(generated[max(0,i-50):i+80]))
           print('Committed:',repr(committed[max(0,i-50):i+80]))
           if os.environ.get('GITHUB_REF_NAME') not in ('gamedev-skills-polish-2026-11-23','market-office-first-person'):sys.exit(1)
           print('Source build will be synchronized when browser checks pass.')
          else:print('Standalone HTML exactly matches the source build')
          PY
      - name: Run course and transcript tests
        run: |
          node --check market/lms.js
          node --check market/sky-textures.js
          node --check market/school-materials.js
          node --check market/school-tables.js
          node --check market/save-manager.js
          node --check market/phone.js
          node --test market/test-academics.cjs market/test-districts.cjs market/test-school.cjs market/test-lms.cjs market/test-game-polish.cjs
      - name: Install browser for gameplay test
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Launch local game
        run: |
          python3 -m http.server 8765 --directory dist > /tmp/lumenvale-server.log 2>&1 &
          sleep 3
      - name: Run real Chromium smoke test
        run: node market/test-browser.cjs
      - name: Upload browser screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lumenvale-academic-browser
          path: |
            lumenvale-academic-smoke.png
            lumenvale-school-smoke.png
            lumenvale-school-exterior.png
            lumenvale-school-library.png
            lumenvale-classroom-table-in-game.png
            lumenvale-library-table-in-game.png
          if-no-files-found: ignore
      - name: Synchronize tested build on design branch
        if: (github.ref_name == 'gamedev-skills-polish-2026-11-23' || github.ref_name == 'market-office-first-person') && success()
        run: |
          git config user.name "LumenVale CI"
          git config user.email "lumenvale-ci@users.noreply.github.com"
          git add dist/index.html
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate tested standalone game from current sources [skip ci]"
            git push origin HEAD:refs/heads/${GITHUB_REF_NAME}
          fi
