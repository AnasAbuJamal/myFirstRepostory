<style>

textarea{display:block;width:100%;border:1px solid #b6c7b2;border-radius:7px;padding:.62rem .72rem;resize:vertical;min-height:108px;background:#fffefa;color:#243c2d;font-size:1rem;line-height:1.55}

.notice{background:#f7ecda;border-color:#dec49d;color:#694c25}

.item-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;margin:1rem 0}

.table-scroll{overflow-x:auto}

dialog{width:min(548px,calc(100% - 24px));padding:0;max-height:88dvh;border:1px solid #95a88f;border-radius:13px;background:#fffdf4;color:var(--ink);box-shadow:0 30px 85px #172b22ae;overscroll-behavior:contain}

.toast{position:fixed;z-index:4;bottom:1.05rem;left:50%;transform:translateX(-50%);max-width:min(85vw,480px);padding:.72rem 1rem;border-radius:9px;color:#fff8dd;background:#204633;box-shadow:0 4px 24px #2d3d2e6e;font-size:.92rem;pointer-events:none}

body{overflow:hidden}
.walk-world{height:100dvh;position:relative;isolation:isolate;background:#a6b9a0;overflow:hidden;color:#fff9e8}

.wave-word-list strong{font-size:1.04rem;color:#2d593c}
.wave-word-list small{font-size:.78rem;color:#687d70}
.wave-builder-tools{display:flex;flex-wrap:wrap;gap:.45rem;margin:.75rem 0}
.wave-builder-tools button{padding:.56rem .74rem;border:1px solid #c2d5bf;border-radius:8px;background:#f2f6ef;color:#325844;font-size:.8rem;font-weight:700}
.wave-builder-tools button.selected{background:#315e49;color:#fff5d8;border-color:#315e49}
.wave-map-area{margin:1rem 0;max-width:100%;overflow:auto;border:1px solid #a9bfa5;border-radius:12px;padding:.55rem;background:#edf3e8}
.wave-map,.wave-builder-map{width:100%;min-height:260px;height:clamp(260px,40vw,400px);position:relative;background:
 linear-gradient(90deg,transparent 48.8%,#c9c3a6 49%,#c9c3a6 51%,transparent 51.2%),
 linear-gradient(0deg,transparent 48.7%,#c9c3a6 49%,#c9c3a6 51%,transparent 51.3%),
 repeating-linear-gradient(0deg,#ecf3e7 0 24px,#dcead8 25px 26px),
 repeating-linear-gradient(90deg,#ecf3e7 0 24px,#dcead8 25px 26px);
 border-radius:8px;overflow:hidden}
.wave-builder-map{cursor:crosshair}
.wave-grid-plot{position:absolute;width:14px;height:14px;border:2px solid #e1bd72;background:#5c7e66;transform:translate(-50%,-50%);border-radius:4px;pointer-events:none}
.wave-map-pin{position:absolute;transform:translate(-50%,-50%);display:grid;justify-items:center;pointer-events:none;text-align:center}
.wave-map-pin>span{color:#315b46;font-size:1.4rem;line-height:1}
.wave-map-pin small{background:#274a3ded;border-radius:5px;padding:.15rem .28rem;color:white;font-size:.58rem;max-width:95px}
.wave-builder-footer{display:flex;justify-content:space-between;gap:1rem;color:#365a44;font-size:.85rem}
.wave-staff-roster{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem;margin:.8rem 0}
.wave-staff-roster>div{background:#eaf2e7;border-radius:9px;padding:.85rem;color:#375d46}
@media(max-width:740px){
 .wave-course-grid,.wave-career-grid{grid-template-columns:1fr}
 .wave-vocab-form{grid-template-columns:1fr}
 .wave-school-stats>div{padding:.55rem}
 .wave-nav{font-size:.58rem}
}
@media(prefers-reduced-motion:reduce){.wave-course{transition:none}}

.wave-plot-tools{display:inline-flex;gap:.25rem;background:#eef4ed;border-radius:8px;padding:.2rem}
.wave-plot-tools button{border-radius:7px!important;padding:.45rem .5rem!important}
.wave-plot-tools button:hover{background:#dcebdc}

.town-street-map {background:#dae2cf}
.town-map-road {position:absolute;display:block;background:#71817c;opacity:.8;pointer-events:none}
.town-map-road.x {height:4px}
.town-map-road.z {width:4px}

#wave-builder-map,.wave-map.town-street-map{background:#d9e2d0;isolation:isolate;overflow:hidden}
.map-surface{position:absolute;display:block;pointer-events:none}
.map-surface.street{background:#88928d}
.map-surface.building{background:#d1bd9e;border:1px solid #a7967f}
.map-surface.park{background:#9bbb7c}
.map-surface.court{background:#c6886c}

.town-pin{position:absolute;transform:translate(-50%,-50%);border:1px solid #f3f6e9;border-radius:50%;background:#375849;color:#fff;line-height:1;font-size:.65rem;font-weight:700;padding:0;width:18px;height:18px}
.town-pin[aria-pressed=true]{z-index:2;background:#865027;outline:2px solid #fff;outline-offset:1px}
.town-map-select{display:flex;align-items:center;gap:.7rem;color:#365a44;font-weight:650}
.town-map-select select{flex:1;min-width:0;border:1px solid #afbfac;border-radius:6px;background:#fffdf7;padding:.45rem;font:inherit}
@media(max-width:500px){.town-pin{width:15px;height:15px;font-size:.59rem}}

/* The viewport shows direction and the current task. Management lives on the phone. */
.place-marker{left:18px;top:18px;background:#182b2cd9;border-color:#eeffe14d;font-size:.76rem;color:#f4f8ee}
.phone-trigger{position:absolute;right:20px;bottom:20px;display:flex;gap:.47rem;align-items:center;padding:.57rem .63rem;background:#182b2cec;border:1px solid #eaf6dc68;border-radius:10px;color:#fff;font:650 .83rem/1.1 var(--sans);z-index:6;min-height:42px}
.phone-trigger:hover{background:#30453b}
.phone-trigger svg,.phone-apps svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.walk-hints{right:20px;bottom:71px;font-size:.72rem;background:#182b2cc8}
dialog[data-surface="phone"]{inset:auto 22px 21px auto;margin:0;width:min(386px,calc(100vw - 40px));max-height:min(670px,calc(100dvh - 40px));border:6px solid #17272a;border-radius:30px;color:#1e3430;background:#f2f5ed;box-shadow:0 18px 60px #0f221d8a}
dialog[data-surface="phone"]::backdrop{background:#111d2348;backdrop-filter:none}
dialog[data-surface="phone"] .modal-head{background:#243c36;color:#eef5e5;padding:.55rem 1rem}
dialog[data-surface="phone"] .modal-body{padding:.83rem 1rem 1rem}
dialog[data-surface="phone"] .title{font:730 1.35rem/1.2 var(--sans);letter-spacing:-.025em;margin:0 0 .65rem;color:#213c35}
#phone-back{margin-left:auto;width:auto;padding:0 .7rem;font:650 .82rem/1.3 var(--sans);min-height:30px;margin-right:.38rem}
#phone-back[hidden]{display:none}
.phone-overview{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.38rem}
.phone-overview div{background:#fff;border:1px solid #dce5d9;border-radius:10px;padding:.47rem .55rem}
.phone-overview span,.phone-overview b{display:block}
.phone-overview span{color:#4e625a;font-size:.72rem}
.phone-overview b{margin-top:.12rem;color:#254b3d;font-size:1.08rem;font-variant-numeric:tabular-nums}
.town-map-player{position:absolute;z-index:3;translate:-50% -50%;width:11px;height:11px;border-radius:50%;background:#2979a3;border:2px solid #fff;box-shadow:0 0 0 1px #18516f;pointer-events:none}
.phone-goal{border-left:2px solid #7d9e68;padding:.1rem 0 .1rem .58rem;margin:.65rem 0;color:#405c4d;font-size:.78rem;line-height:1.3}
.phone-apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.36rem .28rem}
.phone-apps button{display:grid;justify-items:center;gap:.22rem;padding:.32rem .1rem .29rem;border:0;border-radius:10px;background:transparent;color:#26453b;font:650 .73rem/1.15 var(--sans)}
.phone-apps button:hover,.phone-apps button:focus-visible{background:#deebdf}
.phone-app-icon{display:grid;place-items:center;height:32px;width:36px;border-radius:9px;background:#dde9d5;color:#315450}
.phone-app-icon.jade{background:#cee8dd;color:#236254}
.phone-app-icon.gold{background:#f5e8c5;color:#6e542d}
.phone-app-icon.blue{background:#dce9f3;color:#385973}
@media(pointer:coarse){.phone-trigger{bottom:110px}.phone-trigger kbd{display:none}}
@media(max-width:600px){
 .place-marker{top:10px;left:10px}
 .phone-trigger{right:10px}
 .walk-hints{right:10px}.walk-hints>kbd,.walk-hints>span{display:none}
 dialog[data-surface="phone"]{inset:auto 8px 8px auto;width:min(386px,calc(100vw - 16px));max-height:calc(100dvh - 16px)}
}

/* LumenVale Vehicle Design Garage */
.lv-garage-intro{margin:.4rem 0 1rem;padding:1.05rem 1.2rem;border-radius:12px;background:linear-gradient(120deg,#254d45,#426d60);color:#f0f1e5}
.lv-garage-intro h3{color:#f8e4af!important;margin:0 0 .45rem!important;font:700 1.35rem Georgia,serif}
.lv-garage-intro p{margin:.36rem 0;color:#e1e9e0;font-size:.88rem;line-height:1.6}
.lv-garage-intro b{color:#f3d08c}
.lv-garage-cars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.68rem;margin:.85rem 0 1.5rem}
.lv-garage-car{display:grid;align-content:start;gap:.58rem;padding:1rem;border:1px solid #d5d9ca;background:#fffef9;border-radius:11px;min-width:0;box-shadow:0 4px 10px #3149340c;transition:border-color .18s,transform .18s}
.lv-garage-car:hover{border-color:#6e987a;transform:translateY(-2px)}
.lv-car-mark{display:flex;align-items:center;gap:.64rem;border-bottom:1px solid #e7e7d9;padding-bottom:.58rem;font-size:1.25rem;color:#b8995f}
.lv-car-mark span{font:700 1.03rem Georgia,serif;color:#30543e}
.lv-garage-car p{margin:0;color:#5f7667;line-height:1.5;font-size:.81rem}
.lv-garage-car small{color:#a27b40;font-size:.73rem;font-weight:800}
.lv-garage-car .button{justify-self:start;margin-top:auto;font-size:.78rem}
.lv-garage-colors{display:flex;flex-wrap:wrap;gap:.5rem;margin:1rem 0}
.lv-paint-chip{display:flex;align-items:center;gap:.5rem;padding:.45rem .65rem;border:1px solid #c5d4c2;background:#fffefa;border-radius:9px;font-weight:700;font-size:.78rem;color:#365543;cursor:pointer}
.lv-paint-chip span{width:21px;height:21px;display:block;border:1px solid #71847c;border-radius:6px;box-shadow:inset 0 2px 4px #ffffff80}
.lv-paint-chip:hover:not(:disabled),.lv-paint-chip.active{border-color:#4a8162;background:#e8f2e7;box-shadow:0 0 0 1px #619e73}
.lv-paint-chip:disabled{opacity:.62;cursor:default}
@media(max-width:660px){.lv-garage-cars{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.lv-garage-car{transition:none}}


/* Jobs & Research — role-focused learning and meaningful paid employment. */
.job-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem;margin:1.25rem 0}
.job-stats>div{display:grid;gap:.35rem;padding:.9rem;background:#e9f0e7;border:1px solid #d0dfcf;border-radius:10px}
.job-stats small{font-size:.76rem;color:#6a846f}.job-stats b{font-size:1.45rem;color:#345d49}
.job-role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.75rem;margin:1rem 0}
.job-role-card{display:flex;flex-direction:column;gap:.7rem;padding:1.1rem;background:#fffefa;border-radius:12px;border:1px solid #cddbcf;min-width:0;box-shadow:0 4px 14px #243a3012}
.job-role-card header{display:flex;gap:.8rem;align-items:center}
.job-symbol{font-size:1.8rem;display:grid;place-items:center;width:48px;height:48px;border-radius:12px;background:#e8eee3}
.job-role-card h3{margin:0;font:700 1.16rem/1.2 Georgia,serif;color:#2c5240}
.job-role-card small{font-size:.74rem;color:#a17d43}
.job-role-card p{font-size:.88rem;color:#577160;line-height:1.55;margin:0}
.job-requirements{display:grid;gap:.28rem;margin:.2rem 0}
.job-requirements>div{font-size:.79rem;display:flex;align-items:center;justify-content:space-between;gap:.25rem;padding:.35rem .5rem;border-radius:6px}
.job-requirements>div.met{background:#e6f3e6;color:#31724d}
.job-requirements>div.missing{background:#fff0de;color:#8d6144}
.job-requirements small{font-size:.68rem;color:inherit;opacity:.77}
.job-commands{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-top:auto}
.job-commands .button{font-size:.78rem}
.job-hired{color:#388051;font-weight:800;font-size:.83rem}
.job-role-card .button:disabled{opacity:.62;cursor:default}
.job-reading{padding:1.15rem 1.25rem;border:1px solid #d4dcca;background:#fcfaf0;border-radius:12px}
.job-reading small{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:#749077}
.job-reading p{font:1.13rem/1.92 Georgia,serif;color:#32463b;white-space:pre-wrap}
.job-reading-actions{display:flex;gap:.65rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:1.1rem;border-top:1px solid #e1e2ce;padding-top:.8rem}
.job-reading-actions span{font-size:.82rem;color:#708470}
.job-quiz h3{font:700 1.21rem/1.35 Georgia,serif;color:#2d5240;margin:1.3rem 0}
.job-progress{color:#6e876d;font-size:.83rem;font-weight:700}
.job-quiz .city-answer{margin:.45rem 0}
.job-research-grid{display:grid;gap:.65rem;margin:1rem 0}
.job-research-card{padding:1rem;border:1px solid #cfded1;border-left:4px solid #7d9a86;border-radius:9px;background:#fffefa}
.job-research-card small{font-size:.74rem;color:#778e77;font-weight:700}
.job-research-card h3{margin:.3rem 0;font:700 1.15rem Georgia,serif;color:#2c563d}
.job-research-card p{margin:.45rem 0;color:#59715e;line-height:1.55;font-size:.87rem}
.job-research-card>div{display:flex;gap:.8rem;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:.65rem}
.job-research-card>div span{color:#8d754d;font-size:.76rem;font-weight:700}
.job-import{background:#ecf3e9;border:1px dashed #9cbda4;padding:1rem;border-radius:12px;margin:1rem 0}
.job-import h3{margin:0 0 .6rem;color:#315b45}.job-import p{font-size:.83rem;color:#5e7961;margin:.4rem 0 1rem}
.job-import form{display:flex;flex-wrap:wrap;gap:.5rem}.job-import form input{flex:1;min-width:130px}
.job-import input{border:1px solid #b8cbb8;border-radius:8px;padding:.68rem;background:#fff;color:#274b39}
.job-file-field{display:grid;gap:.3rem;margin:1.1rem 0 0;color:#365943;font-size:.83rem;font-weight:800}
.job-file-field input{max-width:100%}
@media(max-width:690px){.job-role-grid{grid-template-columns:1fr}.job-stats{gap:.4rem}.job-stats>div{padding:.65rem}.job-stats b{font-size:1.15rem}}


/* Formal Academic Pathways — separate from open Library exploration */
.pathway-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.75rem;margin:1.1rem 0}
.pathway-summary>div{background:#eaf1e9;border:1px solid #d4e3d7;padding:.9rem;border-radius:11px;display:grid;gap:.3rem}
.pathway-summary small{font-size:.73rem;color:#6a7e70}
.pathway-summary strong{font:700 1.22rem Georgia,serif;color:#315843}
.pathway-goals{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.65rem;margin:.85rem 0 1.4rem}
.pathway-goal{padding:1.05rem .8rem;text-align:left;background:#fffef9;color:#2f513e;border:1px solid #d0dbc9;border-radius:11px;display:grid;gap:.5rem}
.pathway-goal strong{font:700 1.03rem Georgia,serif}
.pathway-goal small{color:#6d8472;font-size:.77rem;line-height:1.5}
.pathway-goal.selected{border:2px solid #52866a;background:#e9f2e7}
.pathway-stage{border-top:1px solid #ced8c9;margin-top:1.4rem;padding-top:.8rem}
.pathway-stage header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.5rem}
.pathway-stage h3{font:700 1.28rem Georgia,serif;color:#2c5740;margin:.4rem 0}
.pathway-stage header small{font-size:.75rem;color:#85917f}
.pathway-course-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem;margin:.9rem 0}
.pathway-course{display:grid;gap:.4rem;text-align:left;border:1px solid #d2dece;background:#fffefa;border-radius:10px;padding:.85rem}
.pathway-course strong{font-size:.87rem;color:#34583f}
.pathway-course small{font-size:.7rem;color:#7a917c}
.pathway-course span{color:#518163;font-size:.75rem;font-weight:700}
.pathway-course.locked{opacity:.75;background:#f1f3ed}
.pathway-course.locked span{color:#956e48}
.pathway-age-label{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;font-size:.88rem;font-weight:700}
.pathway-age-label select{padding:.54rem;border:1px solid #bdccbe;border-radius:8px;background:#fff}
.pathway-alert{background:#fff3df;border:1px solid #e5ccac;color:#876747;padding:.9rem 1rem;border-radius:9px;font-size:.86rem;line-height:1.55}
.pathway-units{display:grid;gap:.5rem;margin:1.2rem 0}
.pathway-units>div{display:flex;align-items:center;justify-content:space-between;gap:.8rem;background:#f3f6ef;border:1px solid #d9e4d8;border-radius:9px;padding:.8rem .9rem}
.pathway-units span{font-size:.87rem;font-weight:750;color:#315e43}
.pathway-units p,.pathway-units small{color:#6a816d;font-size:.8rem;display:block}
.pathway-reading{padding:1rem 1.2rem;background:#fbf8ec;border:1px solid #ded9c8;border-radius:11px;margin:1rem 0}
.pathway-reading h4{color:#406c4b;margin:.2rem 0}
.pathway-reading>p{color:#6b846e}
.pathway-reading article{white-space:pre-wrap;font:1.13rem/1.85 Georgia,serif;color:#333f34;margin:1rem 0}
.pathway-flashcard{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:1rem;min-height:230px;width:100%;padding:1.5rem;border:1px solid #b8cdbb;border-radius:15px;background:linear-gradient(135deg,#edf2e8,#fdf9e8);box-shadow:0 15px 30px #244c3020}
.pathway-flashcard small{letter-spacing:.12em;font-size:.72rem;color:#648166;font-weight:800}
.pathway-flashcard strong{font:700 1.34rem/1.5 Georgia,serif;color:#31523c;max-width:500px}
.pathway-flashcard span{font-size:.78rem;color:#64836a}
.pathway-scroll{overflow:auto;max-width:100%;border:1px solid #d6e1d3;border-radius:9px;margin:1.1rem 0}
.pathway-transcript{width:100%;border-collapse:collapse;background:#fffdfa;font-size:.82rem}
.pathway-transcript th,.pathway-transcript td{padding:.72rem .5rem;text-align:left;border-bottom:1px solid #e5ebdf}
.pathway-transcript th{background:#e9f0e5;color:#3e644b}
.pathway-import{padding:1rem;border:1px solid #bdd4c0;border-radius:11px;background:#f1f6ef;display:grid;gap:1rem;margin:1rem 0}
.pathway-import label,.pathway-import form{display:grid;gap:.45rem;color:#3e654c;font-size:.85rem;font-weight:750}
.pathway-import input{width:100%;padding:.7rem;border:1px solid #c2d1c2;border-radius:8px;background:#fff}
@media(max-width:660px){.pathway-goals{grid-template-columns:1fr}.pathway-course-grid{grid-template-columns:1fr}.pathway-summary>div{padding:.55rem}.pathway-summary strong{font-size:1rem}}
@media(prefers-reduced-motion:reduce){.pathway-flashcard{transition:none}}

</style>

const SAVE_KEY = 'jungle-miner-market-v1';
const FINAL_STEP = 7;

function cleanProgress(input) {
  const saved = input?.version === 1 ? input : {};
  const step = Number.isInteger(saved.step) ? Math.max(0, Math.min(FINAL_STEP, saved.step)) : 0;
  function messages(raw) {
    return Object.fromEntries(['lina', 'maya', 'omar', 'counter'].flatMap(key =>
      typeof raw?.[key] === 'string' ? [[key, raw[key].slice(0, 1800)]] : []));
  }
  return {
    version: 1, step, stand: step === FINAL_STEP && saved.stand === true,
    drafts: messages(saved.drafts), sent: messages(saved.sent),
    words: [...new Set(Array.isArray(saved.words) ? saved.words.filter(word => Object.hasOwn(WORDS, word)) : [])],
    quiet: saved.quiet === true,
  };
}

function shopTotals(state) {
  const linaSold = state.step >= 2;
  const restockOrdered = state.step >= 3;
  const restockArrived = state.step >= 5;
  const omarSold = state.step >= 6;
  const receipts = [
    ...(linaSold ? [{ name: 'Lina’s pickup', quantity: CATALOG.firstOrder, coins: CATALOG.firstOrder * CATALOG.kit, date: 'Friday' }] : []),
    ...(restockOrdered ? [{ name: 'Maya’s supply order', quantity: CATALOG.pack, coins: -CATALOG.wholesale, date: 'Monday' }] : []),
    ...(omarSold ? [{ name: 'Omar’s pickup', quantity: CATALOG.clubOrder, coins: CATALOG.clubOrder * CATALOG.kit, date: 'Wednesday' }] : []),
    ...(state.stand ? [{ name: 'Pickup stand', quantity: null, coins: -CATALOG.stand, date: 'Wednesday' }] : []),
  ];
  const onShelf = 8 - (linaSold ? CATALOG.firstOrder : 0)
    + (restockArrived ? CATALOG.pack : 0) - (omarSold ? CATALOG.clubOrder : 0);
  const reserved = state.step === 1 ? CATALOG.firstOrder : state.step === 5 ? CATALOG.clubOrder : 0;
  return {
    coins: receipts.reduce((balance, entry) => balance + entry.coins, 20),
    onShelf, reserved, available: onShelf - reserved,
    inbound: restockOrdered && !restockArrived ? CATALOG.pack : 0,
    sold: (linaSold ? CATALOG.firstOrder : 0) + (omarSold ? CATALOG.clubOrder : 0),
    receipts,
  };
}

function normalizeReply(text) {
  return text.toLowerCase()
    .normalize('NFKC')
    .replace(/[’‘]/g, "'")
    .replace(/[–—−]/g, '-')
    .replace(/\b([ap])\s*\.\s*m\.?/g, '$1m')
    .replace(/\btwenty[\s-]+one\b/g, '21')
    .replace(/\bforty[\s-]+two\b/g, '42')
    .replace(/\bsixteen\b/g, '16')
    .replace(/\b(one|two|three|four|five|six|seven|ten|twelve)\b/g, n =>
      ({ one: '1', two: '2', three: '3', four: '4', five: '5', six: '6', seven: '7', ten: '10', twelve: '12' })[n])
    .replace(/\bfri\.?(?=\s|$)/g, 'friday').replace(/\bwed\.?(?=\s|$)/g, 'wednesday')
    .replace(/\bmidday\b/g, 'noon');
}
function containsNumber(text, number) {
  return new RegExp('\\b' + number + '\\b').test(text);
}
function timeMention(text, hour, period) {
  const n = new RegExp('\\b' + hour + '(?::00|\\.00)?\\s*' + period + '\\b');
  return n.test(text);
}
function omarTime(text) {
  return /\bwednesday\b/.test(text) && (
    /\bnoon\b/.test(text) || timeMention(text, 12, 'pm') ||
    /\b(?:at\s+12(?::00)?|12:00)\b(?!\s*am\b)/.test(text)
  );
}
function affirmativeLabels(text) {
  const hasLabel = /\b(?:labels?|plant tags?|name tags?)\b/.test(text);
  const excluded = /\b(?:no|without)\s+(?:plant\s+|name\s+)?(?:labels?|tags?)\b|\b(?:labels?|tags?)\s+(?:are\s+not|aren't|won't be)\s+included\b|\b(?:does not|doesn't|do not|don't|won't)\s+(?:include|come with)\s+(?:a\s+|plant\s+)?(?:labels?|tags?)\b/.test(text);
  return hasLabel && !excluded;
}

function replyNotes(message, raw) {
  const text = normalizeReply(raw);
  const enoughWords = raw.trim().split(/\s+/).length >= (message === 'counter' ? 7 : 9);
  if (!enoughWords) return ['Write a short reply in your own words so the reader knows what to do.'];
  let checks;
  if (message === 'lina') {
    checks = [
      [/\b3\b/.test(text), 'How many kits should I expect at the counter?'],
      [containsNumber(text, 21), 'Could you give me the full price for all my kits?'],
      [affirmativeLabels(text), 'Can you confirm whether a plant label comes in each kit?'],
      [/\bfriday\b/.test(text) && (timeMention(text, 4, 'pm') || /\b16:00\b|\b4(?:\s+in\s+the\s+|\s+on\s+friday\s+)(?:afternoon)\b/.test(text)),
        'Please confirm the day and time you’ll have my kits ready.'],
    ];
  } else if (message === 'maya') {
    checks = [
      [/\b(?:1|a|single)\s+(?:single\s+)?pack\b|\b(?:pack|box|set)\s+of\s+4\b|\b4\s+(?:garden\s+)?kits?\b/.test(text) &&
       !/\b(?:2|3|4|5|6|7|8)\s+packs?\b/.test(text),
        'How much should I bring? Check how many more kits you need and how many come in each pack.'],
      [/\bwednesday\b/.test(text) && (timeMention(text, 10, 'am') || /\b10(?::00)?\s+(?:on\s+wednesday\s+|in\s+the\s+)?morning\b|\bmorning\s+at\s+10\b/.test(text)),
        'What day and time should I bring the pack? Please confirm my delivery slot.'],
    ];
  } else if (message === 'omar') {
    checks = [
      [containsNumber(text, 6), 'I need enough for everyone in the club. Can you confirm my quantity?'],
      [omarTime(text), 'I can only make one trip. Look at Maya’s delivery and confirm when all the kits will be ready.'],
      [containsNumber(text, 42), 'How much does the full order cost? I’ll bring that amount.'],
    ];
  } else {
    const requiresSupplies = /\b(?:need|needs|bring|provide|add|supply|supplied|you'?ll want|she'?ll want|your own|her own|separately|just get)\b/.test(text)
      || /\b(?:soil|water)\b[^.!?]{0,40}\b(?:not included|aren't included)\b/.test(text);
    checks = [
      [/\bpots?\b/.test(text) && /\bseeds?\b/.test(text) && affirmativeLabels(text),
        'Can you spell out what’s already in the kit? I want to explain it to her later.'],
      [/\bsoil\b/.test(text) && /\bwater\b/.test(text) && requiresSupplies &&
        !/\b(?:includes?|comes with|contains)\s+(?:extra\s+)?(?:soil|water)\b|\b(?:soil and water|water and soil)\s+(?:are|come)\s+included\b/.test(text),
        'Please tell me what she needs to add herself. Check the two items under “Bring from home.”'],
    ];
  }
  return checks.filter(([works]) => !works).map(([, note]) => note);
}

function replyOrder(state, id, reply) {
  const step = id === 'counter' ? 5 : MAIL[id]?.actionStep;
  if (step !== state.step || step === undefined) return { state };
  const notes = replyNotes(id, reply);
  if (notes.length) return { state, notes };
  return {
    state: { ...state, step: state.step + 1, sent: { ...state.sent, [id]: reply.trim() } },
    notes: [],
  };
}

function completeVisit(state) {
  return state.step === 1 || state.step === 4 ? { ...state, step: state.step + 1 } : state;
}

function completeLevel(state, stand) {
  if (state.step !== 6 || (stand && shopTotals(state).coins < CATALOG.stand)) return state;
  return { ...state, step: FINAL_STEP, stand: Boolean(stand) };
}

function cityBlank(){return {version:1,coins:0,xp:0,lifetime:0,books:{},sites:{},lastTick:Date.now(),manual:{}};}
function cityClean(input){
 const v=cityBlank();
 if(!input || input.version!==1)return v;
 const number=(n,max)=>Number.isFinite(n)?Math.max(0,Math.min(max,Math.floor(n))):0;
 v.coins=number(input.coins,1e12);v.xp=number(input.xp,1e9);v.lifetime=number(input.lifetime,1e12);
 for(const [id,info] of Object.entries(input.books||{})){
 if(/^[a-z0-9-]{1,90}$/.test(id)&&info&&typeof info==='object')
  v.books[id]={count:number(info.count,1e5),last:number(info.last,1e15)};
}
 for(const site of CITY_SITES){
  const info=input.sites?.[site.id];
  // Preserve existing city saves: previously constructed buildings already own their land.
  if(info?.owned||info?.built)v.sites[site.id]={
   owned:true,built:Boolean(info.built),
   staff:info.built&&site.kind==='factory'?number(info.staff,6):0,
   level:info.built?Math.max(1,number(info.level,10)):1,
   landLevel:Math.max(1,Math.min(4,number(info.landLevel,4)||1)),
   builtAt:number(info.builtAt,1e15)
  };
 }
 v.lastTick=number(input.lastTick,1e15)||Date.now();
 for(const site of CITY_SITES)v.manual[site.id]=number(input.manual?.[site.id],1e15);
 return v;
}

function cityProduction(site,record){
 if(!record?.built || site.kind!=='factory')return 0;
 const landLevel=Math.max(1,Math.min(4,record.landLevel||1));
 const training=typeof systemsState!=='undefined'?Math.max(0,systemsState.training?.[site.id]||0):0;
 return Math.floor(site.rate*record.staff*record.level*(1+.25*(landLevel-1))*(1+.06*training));
}

 cityState.coins+=coins;cityState.lifetime+=coins;cityState.xp+=xp;

}
function citySpend(amount){
 if(cityState.coins<amount)return false;
 cityState.coins-=amount;citySave();citySync();return true;
}
function cityTick(now=Date.now()){
 const current=Number.isFinite(now)?now:Date.now();
 let elapsed=Math.floor((current-cityState.lastTick)/CITY_TICK_MS);
 if(elapsed<0){cityState.lastTick=current;citySave();return 0;}
 elapsed=Math.min(elapsed,720); // At most one hour of production while away.
 if(!elapsed)return 0;
 cityState.lastTick=current; // No catch-up loop in the render frame.
 const coins=elapsed*cityIncome();
 if(coins){cityState.coins+=coins;cityState.lifetime+=coins;}
 citySave();
 return coins;
}

const ACADEMY_CONTENT='lumenvale-pack-v1',ACADEMY_PROGRESS='lumenvale-progress-v1',ACADEMY_PROFILE='lumenvale-profile-v1';
function academyStored(key,fallback){try{const d=JSON.parse(localStorage.getItem(key));return d&&typeof d==='object'?d:fallback;}catch{return fallback;}}
const academy={books:academyStored(ACADEMY_CONTENT,[]),progress:academyStored(ACADEMY_PROGRESS,{}),
 profile:academyStored(ACADEMY_PROFILE,{nickname:'Explorer'}),genre:'All',query:''};
function academySave(){
 try{localStorage.setItem(ACADEMY_CONTENT,JSON.stringify(academy.books));
 localStorage.setItem(ACADEMY_PROGRESS,JSON.stringify(academy.progress));
 localStorage.setItem(ACADEMY_PROFILE,JSON.stringify(academy.profile));}catch{notice('Browser storage is full. Export your lesson pack.');}
}
function academyStr(v,max=1000){return String(v??'').trim().slice(0,max);}
function academyWords(pages){return pages.join(' ').trim().split(/\s+/).filter(Boolean).length;}
function academySafeId(title){const slug=academyStr(title,80).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,56);return slug.startsWith('lesson-')?slug:'lesson-'+slug;}
function academyQuestions(book){return Array.isArray(book.questions)&&book.questions.length?book.questions:[{prompt:book.question,choices:book.answers,correctIndex:book.correct}];}
function academyDraft(pages,count){
 const passage=pages.join(' ');
 const sentences=(passage.match(/[^.!?]+[.!?]?/g)||[]).map(x=>x.trim()).filter(x=>x.split(/\s+/).length>=7);
 const vocab=[...new Set((passage.toLowerCase().match(/[a-z]{5,}/g)||[]).filter(x=>!['there','where','their','which','about','would','could','these','those','before','after','because','should','every'].includes(x)))];
 if(!sentences.length||vocab.length<4)throw Error('Add a longer passage or supply your own questions.');
 const out=[];
 for(let i=0;i<Math.min(10,count);i++){
  const sentence=sentences[i%sentences.length];
  const words=(sentence.match(/[a-z]{5,}/gi)||[]).filter(x=>vocab.includes(x.toLowerCase()));
  if(!words.length)continue;
  const correct=words[(i*3+1)%words.length];
  const choices=[correct,...vocab.filter(x=>x!==correct.toLowerCase()&&!words.some(y=>y.toLowerCase()===x)).slice(i*2,i*2+3)];
  for(const v of vocab)if(choices.length<4&&v!==correct.toLowerCase()&&!choices.includes(v))choices.push(v);
  if(choices.length<3)continue;
  const position=i%choices.length,ordered=choices.slice(position).concat(choices.slice(0,position));
  out.push({prompt:'Which word completes this sentence? '+sentence.replace(correct,'_____'),
   choices:ordered,correctIndex:ordered.indexOf(correct),generated:true});
 }
 if(!out.length)throw Error('Could not produce a draft question. Supply a teacher-written question.');
 return out;
}
function academyNormalizeQuestion(q){
 const prompt=academyStr(q?.prompt??q?.question,500),choices=q?.choices??q?.answers;
 const answer=Number(q?.correctIndex??q?.correct);
 if(prompt.length<8||!Array.isArray(choices)||choices.length<2||choices.length>5||
  choices.some(c=>typeof c!=='string'||!c.trim()||c.length>250)||
  !Number.isInteger(answer)||answer<0||answer>=choices.length)throw Error('Invalid question; use prompt, choices, and correctIndex.');
 return {prompt,choices:choices.map(x=>academyStr(x,250)),correctIndex:answer,generated:Boolean(q.generated)};
}
function academyNormalize(raw,i=0,count=3){
 if(!raw||typeof raw!=='object')throw Error('Book '+(i+1)+' must be an object.');
 const title=academyStr(raw.title,90),genre=academyStr(raw.genre??raw.genera??raw.category??'General',36);
 const pages=Array.isArray(raw.pages)?raw.pages.map(x=>academyStr(x,2200)).filter(Boolean):
  (academyStr(raw.text??raw.passage,12000).match(/[\s\S]{1,1200}/g)||[]);
 if(title.length<3||!pages.length||pages.length>14||pages.join(' ').length>16000)throw Error('Book '+(i+1)+' needs a title and 1–14 pages.');
 const questions=Array.isArray(raw.questions)&&raw.questions.length?raw.questions.map(academyNormalizeQuestion):
  academyDraft(pages,Math.max(1,Math.min(10,Number(raw.questionCount??count)||3)));
 const wordCount=academyWords(pages), declared=Number(raw.wordCount||raw.numberOfWords||0);
 const id=academySafeId(raw.id||title);
 return {id,title,genre,shelf:genre,pages,questions,question:questions[0].prompt,
  answers:questions[0].choices,correct:questions[0].correctIndex,wordCount,
  declaredWordCount:declared>0?declared:null,level:academyStr(raw.readingLevel||'General',30),
  reward:Math.max(15,Math.min(300,Number(raw.reward)||Math.round(30+wordCount*.15))),
  xp:Math.max(10,Math.min(90,Math.round(wordCount/8))),published:raw.published!==false,custom:true};
}
function academyMount(){
 for(let i=CITY_BOOKS.length-1;i>=0;i--)if(CITY_BOOKS[i].custom)CITY_BOOKS.splice(i,1);
 if(!Array.isArray(academy.books))academy.books=[];
 const good=[];
 academy.books.slice(0,100).forEach((raw,i)=>{try{const b=academyNormalize(raw,i);good.push(b);if(b.published)CITY_BOOKS.push(b);}catch{}});
 academy.books=good;
}
function academyImport(data,count=3){
 const items=Array.isArray(data)?data:Array.isArray(data?.books)?data.books:[data];
 if(!items.length||items.length>100)throw Error('JSON must contain 1–100 books.');
 const next=items.map((b,i)=>academyNormalize(b,i,count));
 const existing=[...academy.books];
 for(const book of next){const index=existing.findIndex(x=>x.id===book.id);if(index>=0)existing[index]=book;else existing.push(book);}
 if(existing.length>100)throw Error('Browser limit: 100 custom books. Export a pack first.');
 academy.books=existing;academyMount();academySave();citySync();
 return {imported:next.length,mismatches:next.filter(x=>x.declaredWordCount&&x.declaredWordCount!==x.wordCount)};
}

 academy.progress[name]=student;academySave();

function systemsClean(raw){
 const s=systemsBlank();
 if(!raw||raw.version!==1)return s;
 const count=(v,max)=>Number.isFinite(v)?Math.max(0,Math.min(max,Math.floor(v))):0;
 for(const id of Object.keys(LV_PRODUCTS))s.inventory[id]=count(raw.inventory?.[id],1e7);
 for(const e of LV_UPGRADES)s.upgrades[e.id]=Boolean(raw.upgrades?.[e.id]);
 for(const e of LV_TECH)s.tech[e.id]=Boolean(raw.tech?.[e.id]);
 for(const e of LV_CONTRACTS){const state=raw.contracts?.[e.id];if(state==='accepted'||state==='done')s.contracts[e.id]=state;}
 s.paid=count(raw.paid,1e12);s.earned=count(raw.earned,1e12);s.rep=count(raw.rep,1e7);
 s.lastTick=count(raw.lastTick,1e15)||Date.now();
 s.mailRead=Array.isArray(raw.mailRead)?raw.mailRead.filter(x=>typeof x==='string').slice(0,100):[];
 s.ledger=Array.isArray(raw.ledger)?raw.ledger.filter(x=>x&&typeof x.note==='string').slice(0,100):[];
 s.achievements=Array.isArray(raw.achievements)?raw.achievements.filter(x=>typeof x==='string').slice(0,100):[];
 s.treasures=Array.isArray(raw.treasures)?raw.treasures.filter(x=>LV_TREASURES.some(t=>t.id===x)):[];
 s.npcDone=Array.isArray(raw.npcDone)?raw.npcDone.filter(x=>LV_CHARACTERS.some(n=>n.id===x)):[];
 for(const d of LV_HOME_DECOR)s.homeDecor[d.id]=Boolean(raw.homeDecor?.[d.id]);
 s.chainMade=count(raw.chainMade,1e9);
 const garage=raw.garage&&typeof raw.garage==='object'?raw.garage:{};
 s.garage.owned=Array.isArray(garage.owned)?[...new Set(garage.owned.filter(id=>LV_GARAGE_CATALOG.some(c=>c.id===id)))]:['van'];
 if(!s.garage.owned.includes('van'))s.garage.owned.unshift('van');
 s.garage.selected=s.garage.owned.includes(garage.selected)?garage.selected:'van';
 s.garage.paint=LV_GARAGE_PAINTS.some(p=>p.id===garage.paint)?garage.paint:'cream';
 for(const id of Object.keys(LV_PRODUCTS))s.training[id]=count(raw.training?.[id],5);
 return s;
}

function systemsLedger(note,coins){
 systemsState.ledger.unshift({note,coins,at:Date.now()});systemsState.ledger=systemsState.ledger.slice(0,100);
}
function systemsMultiplier(){
 let multiplier=1;
 if(systemsState.upgrades.power)multiplier+=.10;
 if(systemsState.upgrades.research)multiplier+=.10;
 if(systemsState.upgrades.train)multiplier+=.15;
 for(const tech of LV_TECH)if(systemsState.tech[tech.id])multiplier+=tech.boost;
 return multiplier;
}
function systemsExpenseRate(){
 const factories=CITY_SITES.filter(x=>x.kind==='factory'&&cityState.sites[x.id]?.built);
 const staff=factories.reduce((n,x)=>n+(cityState.sites[x.id]?.staff||0),0);
 return staff?Math.max(1,Math.ceil(staff*.8)+Math.floor(factories.length/2)):0;
}
function systemsNetIncome(){return Math.max(0,Math.floor(cityIncome()*systemsMultiplier())-systemsExpenseRate());}
function systemsTick(now=Date.now()){
 let ticks=Math.floor((now-systemsState.lastTick)/CITY_TICK_MS);
 if(ticks<0){systemsState.lastTick=now;systemsSave();return;}
 ticks=Math.min(720,ticks);
 if(!ticks)return;
 systemsState.lastTick=now;
 // The original 3D city engine already grants gross machine income. Apply
 // game expenses, research bonuses and virtual products for the same tick interval.
 const gross=cityIncome(),bonus=Math.floor(gross*(systemsMultiplier()-1))*ticks;
 const charge=Math.min(cityState.coins+bonus,systemsExpenseRate()*ticks);
 cityState.coins+=bonus-charge;cityState.lifetime+=bonus;
 systemsState.paid+=charge;systemsState.earned+=gross*ticks+bonus;
 for(const [id,product] of Object.entries(LV_PRODUCTS)){
  const unit=cityState.sites[id];
  if(unit?.built&&unit.staff>0){
   const count=Math.max(1,Math.floor(ticks*unit.staff*Math.max(1,unit.level)*Math.max(1,unit.landLevel||1)/2));
   systemsState.inventory[id]=Math.min(1e7,(systemsState.inventory[id]||0)+count);
  }
 }
 // Two connected factories create additional finished goods from raw lumber.
 const workshop=cityState.sites.workshop,lumber=cityState.sites.lumber;
 if(workshop?.staff>0&&lumber?.staff>0){
  const batches=Math.min(Math.floor((systemsState.inventory.lumber||0)/2),ticks*workshop.staff);
  if(batches>0){
   systemsState.inventory.lumber-=batches*2;
   systemsState.inventory.workshop=(systemsState.inventory.workshop||0)+batches;
   systemsState.chainMade+=batches;
  }
 }
 if(charge)systemsLedger('Factory wages, power and maintenance',-charge);
 systemsSave();citySave();
 systemsAchievements();
}

function systemsContractReady(contract){
 return Object.entries(contract.goods).every(([id,count])=>(systemsState.inventory[id]||0)>=count);
}
function systemsContract(id){
 const order=LV_CONTRACTS.find(x=>x.id===id);
 if(!order||cityCompleted()<order.needs)return;
 const state=systemsState.contracts[id];
 if(state==='done')return;
 if(state!=='accepted'){
  systemsState.contracts[id]='accepted';systemsLedger('Accepted contract: '+order.title,0);systemsSave();systemsPanel('contracts');
  notice('Contract accepted. Build factories and produce the required goods.');return;
 }
 if(!systemsContractReady(order)){notice('Keep producing goods before dispatching this order.');return;}
 for(const [product,count] of Object.entries(order.goods))systemsState.inventory[product]-=count;
 const reward=Math.floor(order.reward*(systemsState.upgrades.delivery?1.15:1));
 cityEarn(reward,10);systemsState.earned+=reward;systemsState.rep+=order.reputation;
 systemsState.contracts[id]='done';systemsLedger('Delivered contract: '+order.title,reward);
 systemsSave();systemsAchievements();systemsPanel('contracts');
 notice('Order delivered! Earned '+reward+' coins.');
}

function campusEmpty(){return {version:2,subjects:{},career:null,careerLevel:0,words:[],decor:[],plots:{},enrolled:[],lastExam:null};}
function campusSanitize(input){
 const save=campusEmpty();
 if(!input||typeof input!=="object")return save;
 for(const sub of CAMPUS_SUBJECTS){
  const info=input.subjects?.[sub.id];
  if(info&&typeof info==="object")save.subjects[sub.id]={
   complete:Array.isArray(info.complete)?[...new Set(info.complete.filter(i=>Number.isInteger(i)&&i>=0&&i<3))]:[],
   exams:Array.isArray(info.exams)?info.exams.filter(n=>Number.isFinite(n)&&n>=0&&n<=100).slice(-12):[]
  };
 }
 save.enrolled=Array.isArray(input.enrolled)?[...new Set(input.enrolled.filter(x=>CAMPUS_SUBJECTS.some(s=>s.id===x)))]:CAMPUS_SUBJECTS.filter(x=>input.subjects?.[x.id]?.complete?.length||input.subjects?.[x.id]?.exams?.length).map(x=>x.id);
 if(CAMPUS_CAREERS.some(x=>x.id===input.career))save.career=input.career;
 save.careerLevel=Math.max(0,Math.min(99,Number(input.careerLevel)||0));
 save.words=Array.isArray(input.words)?input.words.filter(x=>x&&typeof x.word==="string"&&x.word.length<=80).slice(0,500):[];
 save.decor=Array.isArray(input.decor)?input.decor.filter(x=>CAMPUS_DECOR.some(t=>t.id===x?.kind)&&Number.isInteger(x.x)&&Number.isInteger(x.z)).slice(0,100):[];
 for(const site of CITY_SITES){
  const pos=input.plots?.[site.id];
  if(pos&&Number.isFinite(pos.x)&&Number.isFinite(pos.z)&&Number.isInteger(pos.rotation)){
   save.plots[site.id]={x:Math.round(pos.x),z:Math.round(pos.z),rotation:((pos.rotation%4)+4)%4};
  }
 }
 return save;
}

function campusInitPlotLocations(){
 // Resolve old layouts against the new roads. Ownership, staff and upgrades stay attached to IDs.
 const original=JSON.stringify([campusState.plots,campusState.decor]);
 const oldDecor=campusState.decor;
 campusState.decor=[];
 for(const site of CITY_SITES){
  const saved=campusState.plots[site.id];
  if(!saved)continue;
  const point=nearestBuildPosition(saved,site.id);
  if(point){
   Object.assign(site,point);
   Object.assign(saved,point);
  }
 }
 for(const item of oldDecor){
  const point=nearestBuildPosition(item,null);
  if(point)campusState.decor.push({...item,...point});
 }
 if(original!==JSON.stringify([campusState.plots,campusState.decor]))campusSave();
}
function nearestBuildPosition(preferred,siteId){
 if(campusArchitectValid(preferred.x,preferred.z,siteId))return {x:preferred.x,z:preferred.z};
 let best=null,bestDistance=Infinity;
 for(let z=-14;z<=80;z+=2)for(let x=-54;x<=64;x+=2){
  const distance=(x-preferred.x)**2+(z-preferred.z)**2;
  if(distance<bestDistance&&campusArchitectValid(x,z,siteId)){
   bestDistance=distance;best={x,z};
  }
 }
 return best;
}

function campusArchitectValid(x,z,except=null){
 const size=except?9.8:3.8;
 const item=townRect(x,z,size,size);
 if(x-size/2<TOWN_BOUNDS.left||x+size/2>TOWN_BOUNDS.right||z-size/2<TOWN_BOUNDS.north||z+size/2>TOWN_BOUNDS.south)return false;
 if(TOWN_ROAD_BEDS.some(road=>townIntersects(item,road,2.30)))return false;
 if(TOWN_RESERVED.some(parcel=>townIntersects(item,parcel,.35)))return false;
 if(CITY_SITES.some(site=>site.id!==except&&townIntersects(item,townRect(site.x,site.z,9.8,9.8),.35)))return false;
 if(campusState.decor.some(d=>townIntersects(item,townRect(d.x,d.z,3.8,3.8),.1)))return false;
 if([...LV_CHARACTERS,...LV_TREASURES].some(p=>townIntersects(item,townRect(p.x,p.z,1.4,1.4),.4)))return false;
 return true;
}

function campusPlace(x,z){

function townMapX(x){return (x-TOWN_BOUNDS.left)/(TOWN_BOUNDS.right-TOWN_BOUNDS.left)*100;}
function townMapZ(z){return (z-TOWN_BOUNDS.north)/(TOWN_BOUNDS.south-TOWN_BOUNDS.north)*100;}
function townMapGeometry(){
 function layer(p,kind){
  const w=p.w/(TOWN_BOUNDS.right-TOWN_BOUNDS.left)*100;
  const h=p.d/(TOWN_BOUNDS.south-TOWN_BOUNDS.north)*100;
  return '<i aria-hidden="true" class="map-surface '+kind+'" style="left:'+townMapX(p.x-p.w/2)+
   '%;top:'+townMapZ(p.z-p.d/2)+'%;width:'+w+'%;height:'+h+'%"></i>';
 }
 return TOWN_ROAD_BEDS.map(r=>layer(r,'street')).join('')+
  [...TOWN_PUBLIC_PLACES,MARKET_OFFICE,...TOWN_HOMES].map(p=>layer(p,'building')).join('')+
  layer(townRect(-6.5,54.6,19.2,17.9),'park')+layer(PARK_COURT,'court');
}

function jobDefault(){return {version:1,hired:[],shifts:{},completedResearch:[],teacherProjects:[],lastImport:null};}
function jobNormalizeProject(raw,source='Teacher pack'){
 if(!raw||typeof raw!=='object')throw Error('Research item must be an object.');
 const title=String(raw.title||'').trim().slice(0,130),
  text=String(raw.text||raw.readingText||raw.passage||'').trim().slice(0,12000),
  field=String(raw.field||'Science').trim().slice(0,70),
  summary=String(raw.summary||'').trim().slice(0,500),
  id=String(raw.id||raw.publishCode||'').trim();
 if(!title||!field||text.split(/\s+/).length<55||!summary)throw Error('Provide a title, summary, field and at least 55 words.');
 if(!/^[A-Za-z0-9_-]{4,90}$/.test(id))throw Error('Every project needs a valid ID or publication code.');
 const rawQs=raw.questions;
 if(!Array.isArray(rawQs)||rawQs.length<2||rawQs.length>8)throw Error('Provide between 2 and 8 reviewed multiple-choice questions.');
 const questions=rawQs.map(q=>{
  const prompt=String(q?.prompt||q?.question||'').trim().slice(0,600);
  const choices=Array.isArray(q?.choices)?q.choices.map(x=>String(x).trim().slice(0,250)):[];
  const correctIndex=Number(q?.correctIndex);
  if(prompt.length<10||choices.length<2||choices.length>5||choices.some(x=>!x)||!Number.isInteger(correctIndex)||correctIndex<0||correctIndex>=choices.length)
   throw Error('Each question needs choices and a valid zero-based correctIndex.');
  return {prompt,choices,correctIndex};
 });
 const reward=Math.min(220,Math.max(50,Number.isFinite(raw.reward)?Math.round(raw.reward):110));
 return {id,title,text,field,summary,questions,reward,teacher:String(raw.teacher||source).slice(0,80)};
}
function jobRestore(raw){
 const state=jobDefault();
 if(!raw||raw.version!==1)return state;
 state.hired=Array.isArray(raw.hired)?[...new Set(raw.hired.filter(id=>JOB_ROLES.some(r=>r.id===id)))]:[];
 if(raw.shifts&&typeof raw.shifts==='object')for(const role of JOB_ROLES){
  const entry=raw.shifts[role.id];if(entry){
   state.shifts[role.id]={count:Math.max(0,Math.min(1e5,Number(entry.count)||0)),
    last:Math.max(0,Math.min(Date.now()+60000,Number(entry.last)||0)),earned:Math.max(0,Math.min(1e7,Number(entry.earned)||0))};
  }
 }
 state.completedResearch=Array.isArray(raw.completedResearch)?raw.completedResearch.filter(x=>typeof x==='string'&&x.length<=90).slice(0,100):[];
 if(Array.isArray(raw.teacherProjects))for(const p of raw.teacherProjects.slice(0,25)){try{state.teacherProjects.push(jobNormalizeProject(p,p.teacher));}catch{}}
 state.lastImport=typeof raw.lastImport==='string'?raw.lastImport.slice(0,80):null;
 return state;
}

 });

 return results;

function jobAnswer(answer){
 const session=jobSession;if(!session)return;
 const questions=session.kind==='research'?session.project.questions:session.task.questions;
 const current=questions[session.step];if(!current)return;
 if(Number(answer)!==current.correctIndex){
  session.mistakes++;jobShowQuestion('That answer is not supported by the passage. Review the evidence and retry.');return;
 }
 session.step++;
 if(session.step<questions.length){jobShowQuestion();return;}
 const isResearch=session.kind==='research',role=isResearch?jobById('researcher'):jobById(session.id);
 let reward;

  const key=session.project.id;
  if(jobState.completedResearch.includes(key)){jobSession=null;jobResearchList();return;}
  reward=session.project.reward;
  jobState.completedResearch.push(key);
 }else{
  const saved=jobState.shifts[role.id]||{count:0,last:0,earned:0};
  reward=role.wage;
  saved.count++;saved.last=Date.now();saved.earned+=reward;
  jobState.shifts[role.id]=saved;
 }
 const name=isResearch?session.project.title:session.task.title;
 jobSession=null;jobSave();cityEarn(reward,isResearch?25:12);
 cityPanel('Work completed','+'+reward+' coins',
 '<div class="city-success-medal">★</div><h3>'+esc(name)+' completed</h3>'+
 '<p>You studied the instructions, answered every question, and earned <strong>'+reward+' coins</strong>.</p>'+

}

function jobOpenResearch(id){
 if(!jobState.hired.includes('researcher')||!jobEligible(jobById('researcher'))){notice('Become a qualified Research Scientist first.');return;}
 const project=jobAllResearch().find(p=>p.id===id);if(!project||jobState.completedResearch.includes(id))return;

function jobImportPack(payload,label='Imported research'){
 const list=Array.isArray(payload)?payload:Array.isArray(payload?.projects)?payload.projects:[payload];
 if(!list.length||list.length>25)throw Error('Import 1–25 projects in a research pack.');
 const items=list.map(x=>jobNormalizeProject(x,label));
 const reserved=new Set(JOB_SAMPLE_RESEARCH.map(p=>p.id));
 let added=0;
 for(const project of items){
  if(reserved.has(project.id))throw Error('This ID belongs to a built-in research lesson.');
  const old=jobState.teacherProjects.findIndex(p=>p.id===project.id);
  if(old>=0)jobState.teacherProjects[old]=project;
  else if(jobState.teacherProjects.length<25){jobState.teacherProjects.push(project);added++;}
 }
 jobState.lastImport=label;jobSave();
 return {added,total:items.length};
}
async function jobImportFile(file){
 if(!file||file.size>1024*1024)throw Error('JSON file must be smaller than 1 MB.');
 const contents=JSON.parse(await file.text());
 const added=jobImportPack(contents,file.name);
 notice('Loaded '+added.total+' research project'+(added.total===1?'':'s')+'.');jobResearchList();
}
async function jobFetchCode(code){
 const value=String(code||'').trim();
 if(!/^[A-Za-z0-9_-]{8,45}$/.test(value)){notice('Enter a valid research code.');return;}
 const endpoint='https://lumenvale-teachers.vercel.app/api/research/'+encodeURIComponent(value);
 try{
  const response=await fetch(endpoint,{method:'GET',mode:'cors',credentials:'omit'});
  if(!response.ok)throw Error(response.status===404?'Project not found or unpublished.':'Research service is unavailable.');
  const payload=await response.json();
  const result=jobImportPack(payload,'Teacher project '+value);
  notice('Research imported: '+result.total+' project.');jobResearchList();
 }catch(error){notice(error?.message||'Could not load research. Try an exported JSON pack instead.');}
}
function jobInit(){

  const button=event.target.closest('[data-jobs]');if(!button)return;

  if(action==='jobs')jobPanel();

  if(action==='shift')jobOpenShift(id);

  if(action==='research-open')jobOpenResearch(id);
  if(action==='start-quiz')jobStartQuiz();
  if(action==='reread')jobShowReading();

 });

 });

  if(event.target.id!=='job-file-input')return;
  try{await jobImportFile(event.target.files?.[0]);}catch(error){notice(error.message||'Invalid research pack.');}
 });
}


/* LumenVale Academic Pathways — JSON-defined school and college-inspired curricula.
 * Formal grades/recitation verification require a future authenticated roster sync.
 * Student offline packs and grades are always labeled PRACTICE / UNVERIFIED.
 */
const PATHWAYS_KEY='lumenvale-academic-v1';
const PATHWAYS_TYPES={catalog:'lumenvale.catalog',pack:'lumenvale.academic-pack',quran:'lumenvale.quran-plan',exam:'lumenvale.exam-pack',cards:'lumenvale.flashcard-pack'};
function pathwayInitial(){return {version:1,goal:'biology',ageBand:'10-13',enrolled:[],packs:{},quranPlans:{},study:{},scores:{},recitations:{},history:[],flashcardReviews:{},importNames:[]};}
function pathwayString(value,max=500){return String(value??'').trim().slice(0,max);}
function pathwayValidateQuestions(list,name,limits={min:2,max:30}){
 if(!Array.isArray(list)||list.length<limits.min||list.length>limits.max)throw Error(name+' needs '+limits.min+'–'+limits.max+' questions.');
 return list.map((q,i)=>{
  const prompt=pathwayString(q?.prompt,700);
  const choices=Array.isArray(q?.choices)?q.choices.map(c=>pathwayString(c,250)):[];
  const correctIndex=Number(q?.correctIndex);
  if(prompt.length<9||choices.length<2||choices.length>5||choices.some(c=>!c)||
    !Number.isInteger(correctIndex)||correctIndex<0||correctIndex>=choices.length)
   throw Error(name+' question '+(i+1)+' must contain valid choices and correctIndex.');
  return {prompt,choices,correctIndex};
 });
}
function pathwayValidatePack(raw){
 if(!raw||raw.kind!==PATHWAYS_TYPES.pack||raw.version!==1)throw Error('Expected lumenvale.academic-pack JSON, version 1.');
 const courseId=pathwayString(raw.courseId,35);
 const course=LV_DEFAULT_ACADEMICS.courses.find(c=>c.id===courseId);
 if(!course||course.kind==='teacher-recitation')throw Error('Unknown academic course or recitation requires a Qur’an plan.');
 if(!Array.isArray(raw.lessons)||raw.lessons.length<1||raw.lessons.length>16)throw Error('An academic pack requires 1–16 lessons.');
 const lessons=raw.lessons.map((l,i)=>{
  const id=pathwayString(l?.id,45),title=pathwayString(l?.title,130),reading=pathwayString(l?.reading,11000);
  if(!/^[a-zA-Z0-9_-]{3,45}$/.test(id)||title.length<3||reading.split(/\s+/).length<35)
   throw Error('Lesson '+(i+1)+' needs a unique ID, title, and 35+ words of reading.');
  const objectives=Array.isArray(l.objectives)?l.objectives.slice(0,7).map(x=>pathwayString(x,180)).filter(Boolean):[];
  const flashcards=Array.isArray(l.flashcards)?l.flashcards.slice(0,50).map(f=>{
   const front=pathwayString(f?.front,180),back=pathwayString(f?.back,600);
   if(!front||!back)throw Error('Flashcard must have front and back text.');
   return {front,back};
  }):[];
  const practice=l.practice?pathwayValidateQuestions(l.practice,'Practice', {min:1,max:20}):[];
  return {id,title,reading,objectives,flashcards,practice};
 });
 if(new Set(lessons.map(x=>x.id)).size!==lessons.length)throw Error('Duplicate lesson IDs.');
 const exam=pathwayValidateQuestions(raw.exam?.questions,'Final examination',{min:3,max:40});
 const passPercent=Math.max(60,Math.min(100,Number(raw.gradePolicy?.passPercent)||70));
 return {kind:PATHWAYS_TYPES.pack,version:1,courseId,title:pathwayString(raw.title,160)||course.title,
  author:pathwayString(raw.author,100)||'Teacher materials',lessons,
  exam:{title:pathwayString(raw.exam?.title,150)||'Final examination',questions:exam},
  gradePolicy:{passPercent},source:pathwayString(raw.source,300),publishedAt:pathwayString(raw.publishedAt,40)};
}
function pathwayValidateExam(raw){
 const courseId=pathwayString(raw.courseId,35),course=pathwayCourse(courseId);
 if(!course||course.kind==='teacher-recitation')throw Error('Exam pack has an unknown academic course.');
 const exam=pathwayValidateQuestions(raw.exam?.questions,'Exam',{min:3,max:40});
 return {kind:PATHWAYS_TYPES.exam,version:1,courseId,title:pathwayString(raw.title,130)||'Exam Pack',
  exam:{title:pathwayString(raw.exam?.title,150)||'Final exam',questions:exam},
  gradePolicy:{passPercent:Math.max(60,Math.min(100,Number(raw.gradePolicy?.passPercent)||70))}};
}
function pathwayValidateCards(raw){
 const courseId=pathwayString(raw.courseId,35),course=pathwayCourse(courseId);
 if(!course||course.kind==='teacher-recitation')throw Error('Flashcard pack has an unknown academic course.');
 const lessonId=pathwayString(raw.lessonId,45);
 if(!/^[a-zA-Z0-9_-]{3,45}$/.test(lessonId))throw Error('Choose an existing lessonId.');
 if(!Array.isArray(raw.flashcards)||!raw.flashcards.length||raw.flashcards.length>60)
  throw Error('Flashcard pack requires 1–60 cards.');
 const flashcards=raw.flashcards.map(card=>{
  const front=pathwayString(card?.front,180),back=pathwayString(card?.back,600);
  if(!front||!back)throw Error('Each card needs front and back text.');
  return {front,back};
 });
 return {kind:PATHWAYS_TYPES.cards,version:1,courseId,lessonId,
  title:pathwayString(raw.title,130)||'Flashcard Practice',flashcards};
}
function pathwayValidateQuran(raw){
 if(!raw||raw.kind!==PATHWAYS_TYPES.quran||raw.version!==1)throw Error('Expected lumenvale.quran-plan JSON, version 1.');
 const courseId=pathwayString(raw.courseId,40);
 const course=LV_DEFAULT_ACADEMICS.courses.find(c=>c.id===courseId&&c.kind==='teacher-recitation');
 if(!course)throw Error('Qur’an plan must target a valid memorization course.');
 if(!Array.isArray(raw.targets)||raw.targets.length<1||raw.targets.length>30)throw Error('A memorization plan needs 1–30 targets.');
 const targets=raw.targets.map((t,i)=>{
  const surah=pathwayString(t.surah,100),verses=pathwayString(t.verses,60),notes=pathwayString(t.notes,300);
  if(!surah||!verses)throw Error('Target '+(i+1)+' needs surah and verse range.');
  return {surah,verses,notes};
 });
 return {kind:PATHWAYS_TYPES.quran,version:1,courseId,title:pathwayString(raw.title,130)||course.title,
  teacher:pathwayString(raw.teacher,100)||'Qur’an teacher',targets,recitationMode:'teacher-live',teacherApprovalRequired:true};
}
function pathwayRestore(raw){
 const state=pathwayInitial();
 if(!raw||raw.version!==1)return state;
 if(LV_DEFAULT_ACADEMICS.programs.some(p=>p.id===raw.goal))state.goal=raw.goal;
 if(['10-13','14-17','18+'].includes(raw.ageBand))state.ageBand=raw.ageBand;
 if(Array.isArray(raw.enrolled))state.enrolled=[...new Set(raw.enrolled.filter(id=>LV_DEFAULT_ACADEMICS.courses.some(c=>c.id===id)))].slice(0,30);

function pathwayGPA(){

 for(const c of LV_DEFAULT_ACADEMICS.courses){
  const score=pathwayState.scores[c.id];

  const points=score>=90?4:score>=80?3:score>=70?2:score>=60?1:0;
  weighted+=c.credits*points;credits+=c.credits;

}

async function pathwayRedeemRecitation(code,studentCode){
 const value=pathwayString(code,48),student=pathwayString(studentCode,40);
 if(student.length<3){notice('Enter your private classroom code.');return;}
 if(!/^[A-Za-z0-9_-]{20,48}$/.test(value)){notice('Enter the complete teacher approval code.');return;}
 try{
  const response=await fetch('https://lumenvale-teachers.vercel.app/api/recitation/redeem',{
   method:'POST',mode:'cors',credentials:'omit',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({code:value,studentCode:student})
  });
  const result=await response.json();
  if(!response.ok)throw Error(result?.error||'Unable to verify recitation.');
  const id=result?.courseId;
  if(!['QUR-M1','QUR-H1'].includes(id)||result?.verified!==true)throw Error('Invalid verification response.');
  const previouslyCompleted=Boolean(pathwayState.recitations[id]?.complete);
  pathwayState.recitations[id]={verified:true,complete:previouslyCompleted||Boolean(result.courseComplete),
   verifiedAt:new Date().toISOString()};
  pathwaySave();
  const coins=Math.max(0,Math.min(100,Number(result.coins)||0));
  if(coins)cityEarn(coins,8);
  notice('Teacher recitation verified! +'+coins+' coins.');
  pathwayQuran();
 }catch(error){notice(error.message||'Teacher verification is unavailable.');}
}

 for(const item of parsed.filter(x=>x.kind===PATHWAYS_TYPES.pack)){
  if(!nextPacks[item.courseId]||JSON.stringify(nextPacks[item.courseId])!==JSON.stringify(item))
   reset.add(item.courseId);
  nextPacks[item.courseId]=item;
 }
 for(const item of parsed){
  if(item.kind===PATHWAYS_TYPES.quran){nextPlans[item.courseId]=item;continue;}
  if(item.kind===PATHWAYS_TYPES.pack)continue;
  const base=nextPacks[item.courseId];
  if(!base)throw Error('Import a full lesson pack for '+item.courseId+' before separate exams or flashcards.');
  if(item.kind===PATHWAYS_TYPES.exam){
   base.exam=item.exam;base.gradePolicy=item.gradePolicy;
   reset.add(item.courseId);
  }else{
   const lesson=base.lessons.find(l=>l.id===item.lessonId);
   if(!lesson)throw Error('Flashcard pack refers to a missing lesson: '+item.lessonId);
   lesson.flashcards=item.flashcards;
  }
 }
 pathwayState.packs=nextPacks;pathwayState.quranPlans=nextPlans;
 for(const id of reset){delete pathwayState.study[id];delete pathwayState.scores[id];}
 pathwayState.importNames=[...new Set([name,...pathwayState.importNames])].slice(0,15);
 pathwaySave();return parsed.length;
}

/* Offline procedural asphalt with aggregates, repairs, weathering and narrow cracks. */
function addStreetSurfaceTextures({T,outside,streets,low}){
 if(low)return; // Canvas software fallback retains its lightweight coloured road beds.
 const canvas=document.createElement('canvas');canvas.width=256;canvas.height=256;
 const ctx=canvas.getContext('2d');if(!ctx)return;
 let seed=74132;
 const rnd=()=>((seed=(Math.imul(seed,1664525)+1013904223)>>>0)/4294967296);
 ctx.fillStyle='#586263';ctx.fillRect(0,0,256,256);
 for(let i=0;i<19200;i++){
  const v=Math.floor(57+rnd()*87);
  ctx.fillStyle='rgba('+v+','+(v+5)+','+(v+5)+','+(.11+rnd()*.28)+')';
  ctx.fillRect(rnd()*256,rnd()*256,.4+rnd()*1.7,.4+rnd()*1.7);
 }
 for(let i=0;i<12;i++){
  ctx.fillStyle=i%2?'rgba(30,39,40,.12)':'rgba(173,167,149,.08)';
  ctx.fillRect(rnd()*256,rnd()*256,8+rnd()*38,3+rnd()*13);
 }
 for(let i=0;i<29;i++){
  let x=rnd()*256,y=rnd()*256;ctx.beginPath();ctx.moveTo(x,y);
  for(let j=0;j<4;j++){x+=(rnd()-.5)*18;y+=(rnd()-.5)*18;ctx.lineTo(x,y);}
  ctx.strokeStyle='rgba(26,31,32,'+(.10+rnd()*.15)+')';
  ctx.lineWidth=.4+rnd()*.8;ctx.stroke();
 }
 const asphalt=new T.CanvasTexture(canvas);
 asphalt.wrapS=asphalt.wrapT=T.RepeatWrapping;
 asphalt.colorSpace=T.SRGBColorSpace;asphalt.anisotropy=4;
 function surface(w,d,x,z,y,turn){
  const map=asphalt.clone();map.repeat.set(Math.max(1,w/9),Math.max(1,d/9));map.needsUpdate=true;
  const mesh=new T.Mesh(new T.PlaneGeometry(w,d),
   new T.MeshLambertMaterial({color:'#f8faf6',map,side:T.DoubleSide}));
  mesh.rotation.x=-Math.PI/2;if(turn)mesh.rotation.z=Math.PI/2;
  mesh.position.set(x,y,z);mesh.receiveShadow=true;mesh.name='Textured asphalt';
  outside.add(mesh);
 }
 for(const s of streets){
  const middle=(s.from+s.to)/2,len=s.to-s.from;
  if(s.axis==='x')surface(len,s.width,middle,s.at,.053,false);
  else surface(len,s.width,s.at,middle,.053,true);
 }
 // Junction overlays are above the plain intersection fill but below the crosswalk paint.
 for(const a of streets.filter(s=>s.axis==='x'))for(const b of streets.filter(s=>s.axis==='z')){
  if(b.at<a.from||b.at>a.to||a.at<b.from||a.at>b.to)continue;
  surface(b.width+.13,a.width+.13,b.at,a.at,.0785,false);
 }
}


function createCityWorld({T,exterior,box,piece,renderer}){
 const city=new T.Group();
 exterior.add(city);
 const low=renderer.isSoftware;
 const PI=Math.PI;
 const mat=new Map();
 function material(color){
  if(!mat.has(color))mat.set(color,new T.MeshLambertMaterial({color,flatShading:true,side:T.DoubleSide}));
  return mat.get(color);
 }
 function b(g,x,y,z,w,h,d,color){return box(g,x,y,z,w,h,d,color);}
 function roof(g,x,y,z,w,d,color){
  const l=b(g,x-w*.23,y,z,w*.57,.16,d+.25,color);
  const r=b(g,x+w*.23,y,z,w*.57,.16,d+.25,color);
  l.rotation.z=.36;r.rotation.z=-.36;
  b(g,x,y+.19,z,.16,.16,d+.3,'#f5dca5');
 }
 function cylinder(g,x,y,z,r,h,color,segments=8){
  const geo=new T.CylinderGeometry(r,r,h,segments);
  const mesh=new T.Mesh(geo,material(color));
  mesh.position.set(x,y,z);g.add(mesh);return mesh;
 }
 function sphere(g,x,y,z,r,color){
  const mesh=new T.Mesh(new T.IcosahedronGeometry(r,low?0:1),material(color));

// Draw the same Three.js meshes and cameras with Canvas when WebGL is unavailable.
function createSoftwareRenderer(T, canvas) {
  const ctx = canvas.getContext('2d', { alpha:false });
  if (!ctx) throw new Error('This browser could not start a graphics renderer.');
  const view = new T.Object3D().matrix;
  const modelView = view.clone();
  const instance = view.clone();
  const color = new T.Color();
  const sun = new T.Vector3(-.46,.79,-.39);
  const light = new T.Vector3();
  const geometry = new WeakMap();
  let width=1,height=1,ratio=1,pixelRatio=1,rect=[0,0,1,1];

  function setSize(w,h) {
    width=w;height=h;
    ratio=Math.min(pixelRatio,1,960/w,650/h);
    canvas.width=Math.max(1,Math.floor(w*ratio));
    canvas.height=Math.max(1,Math.floor(h*ratio));
    rect=[0,0,w,h];
  }
  function getGeometry(source) {
    if (!geometry.has(source)) {
      const pos=source.getAttribute('position');
      geometry.set(source,{positions:pos.array,index:source.getIndex()?.array,points:pos.count});
    }
    return geometry.get(source);
  }
  function clipAtNear(vertices,near) {
    const clipped=[];
    for (let i=0;i<vertices.length;i++) {
      const a=vertices[i], b=vertices[(i+1)%vertices.length];
      const inside=a[2]>=near, nextInside=b[2]>=near;
      if (inside) clipped.push(a);
      if (inside!==nextInside) {
        const t=(near-a[2])/(b[2]-a[2]);
        clipped.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,near]);
      }
    }
    return clipped;
  }
  function tone(value) {
    return Math.round(255*Math.pow(Math.min(1,Math.max(0,value)),.4545));
  }
  const buffers = new Map();
  function render(scene,camera) {
    const [left,bottom,logicalWidth,logicalHeight]=rect;
    const w=Math.floor(logicalWidth*ratio), h=Math.floor(logicalHeight*ratio);
    if(w<1||h<1)return;
    const halfX=w/2, halfY=h/2;
    const key=w+'x'+h;
    if(!buffers.has(key)){
      if(buffers.size>3)buffers.clear();
      const image=ctx.createImageData(w,h);
      buffers.set(key,{image,pixels:new Uint32Array(image.data.buffer),depth:new Float32Array(w*h)});
    }
    const {image,pixels,depth}=buffers.get(key);
    const sky=scene.background?.getHex?.()??0xc2dad5;
    pixels.fill((255<<24)|((sky&255)<<16)|(sky&65280)|(sky>>>16));
    const exposure=scene.userData.townLight||1;
    const labels=[];
    depth.fill(0);
    function triangleFill(a,b,c,ink) {
      const minX=Math.max(0,Math.ceil(Math.min(a[0],b[0],c[0])-.5));
      const minY=Math.max(0,Math.ceil(Math.min(a[1],b[1],c[1])-.5));
      const maxX=Math.min(w-1,Math.floor(Math.max(a[0],b[0],c[0])-.5));
      const maxY=Math.min(h-1,Math.floor(Math.max(a[1],b[1],c[1])-.5));
      if (minX>maxX||minY>maxY) return;
      const ax=b[0]-a[0],ay=b[1]-a[1], bx=c[0]-a[0],by=c[1]-a[1];
      const area=ax*by-ay*bx;
      if(Math.abs(area)<.001)return;
      const dbx=by/area,dcx=-ay/area, dby=-bx/area,dcy=ax/area;
      const startX=minX+.5-a[0],startY=minY+.5-a[1];
      const startB=dbx*startX+dby*startY,startC=dcx*startX+dcy*startY;
      const nearB=b[2]-a[2],nearC=c[2]-a[2];
      for(let y=minY;y<=maxY;y++){
        let weightB=startB+dby*(y-minY),weightC=startC+dcy*(y-minY);
        let pixel=y*w+minX;
        for(let x=minX;x<=maxX;x++,pixel++,weightB+=dbx,weightC+=dcx){
          if(weightB<-.0001||weightC<-.0001||weightB+weightC>1.0001)continue;
          const z=a[2]+weightB*nearB+weightC*nearC;
          if(z<=depth[pixel])continue;
          depth[pixel]=z;
          pixels[pixel]=ink;
        }
      }
    }
    const scale=halfY/Math.tan(camera.fov*Math.PI/360), near=Math.max(.065,camera.near);
    scene.updateMatrixWorld(true);
    camera.updateMatrixWorld(true);
    const matrix=camera.matrixWorldInverse;
    light.copy(sun).transformDirection(matrix);
    scene.traverseVisible(object => {
      if (!object.isMesh || !object.geometry || !object.material?.color) return;
      const {positions,index,points}=getGeometry(object.geometry);
      const material=object.material;
      const sign=object.userData.citySign;
      if(sign){
        const position=new T.Vector3().setFromMatrixPosition(object.matrixWorld).applyMatrix4(matrix);
        const d=-position.z;
        if(d>near&&d<42)labels.push({x:halfX+position.x*scale/d,y:halfY-position.y*scale/d,d,sign});
      }
      view.multiplyMatrices(matrix,object.matrixWorld);
      const models=object.isInstancedMesh?object.count:1;
      for (let model=0;model<models;model++) {
        if (object.isInstancedMesh) {
          object.getMatrixAt(model,instance);
          modelView.multiplyMatrices(view,instance);
          object.getColorAt(model,color);
        } else {
          modelView.copy(view);
          color.copy(material.color);

        }
        const m=modelView.elements;
        if (object.isInstancedMesh) {
          const depth=-m[14];
          if (depth< -6 || depth>62 || Math.abs(m[12])>Math.max(0,depth)*w/h*.98+8) continue;
        }
        const transformed=new Array(points);
        for (let i=0;i<points;i++) {
          const x=positions[i*3],y=positions[i*3+1],z=positions[i*3+2];
          transformed[i]=[
            m[0]*x+m[4]*y+m[8]*z+m[12],
            m[1]*x+m[5]*y+m[9]*z+m[13],
            -(m[2]*x+m[6]*y+m[10]*z+m[14]),
          ];
        }
        const count=index?index.length:points;
        for (let i=0;i<count;i+=3) {
          const a=transformed[index?index[i]:i];
          const b=transformed[index?index[i+1]:i+1];
          const c=transformed[index?index[i+2]:i+2];
          if (a[2]<near && b[2]<near && c[2]<near) continue;
          const triangle=[a,b,c];
          const clipped=a[2]>=near && b[2]>=near && c[2]>=near ? triangle : clipAtNear(triangle,near);
          const projected=clipped.map(([x,y,z])=>[halfX+x*scale/z,halfY-y*scale/z,1/z]);
          if (projected.every(p=>p[0]<0) || projected.every(p=>p[1]<0) ||
              projected.every(p=>p[0]>w) || projected.every(p=>p[1]>h)) continue;
          const [p,q,r]=projected;
          const side=(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);
          if (side>=0 && material.side!==T.DoubleSide) continue;
          const ux=b[0]-a[0], uy=b[1]-a[1], uz=a[2]-b[2];
          const vx=c[0]-a[0], vy=c[1]-a[1], vz=a[2]-c[2];
          const nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
          const length=Math.hypot(nx,ny,nz)||1;
          const incidence=Math.max(0,(nx*light.x+ny*light.y+nz*light.z)/length);
          const shade=material.isMeshBasicMaterial?1:exposure*(.65+.40*incidence+.14*Math.max(0,ny/length));
          const distance=(a[2]+b[2]+c[2])/3;
          const fog=Math.min(.48,Math.max(0,(distance-20)*.009));
          const r8=tone(color.r*shade*(1-fog)+.54*fog);
          const g8=tone(color.g*shade*(1-fog)+.67*fog);
          const b8=tone(color.b*shade*(1-fog)+.60*fog);
          const ink=(255<<24)|(b8<<16)|(g8<<8)|r8;
          for(let i=1;i<projected.length-1;i++)triangleFill(projected[0],projected[i],projected[i+1],ink);
        }
      }
    });
    const leftPx=Math.floor(left*ratio),topPx=canvas.height-Math.floor(bottom*ratio)-h;
    ctx.putImageData(image,leftPx,topPx);
    ctx.save();
    ctx.beginPath();ctx.rect(leftPx,topPx,w,h);ctx.clip();
    ctx.fillStyle='#fff1cb';ctx.textAlign='center';ctx.textBaseline='middle';
    for(const {x,y,d,sign} of labels){
      if(x<2||y<2||x>w-2||y>h-2)continue;
      const actual=depth[Math.floor(y)*w+Math.floor(x)];
      if(actual===0||Math.abs(actual-1/d)>.012)continue;
      const font=sign.height*scale/d*.49;
      if(font<6)continue;
      ctx.font='600 '+Math.min(56,font)+'px Georgia';
      ctx.fillText(sign.text,leftPx+x,topPx+y,sign.width*scale/d*.88);
    }
    ctx.restore();
  }
  return {
    isSoftware:true, setSize, render,
    setPixelRatio(value){pixelRatio=value;},getPixelRatio(){return ratio;},
    setViewport(...next){rect=next;},
    // Canvas clips each render to its own viewport.
    setScissor(){},setScissorTest(){},

      skyLight.groundColor.set('#c6bba3');
      skyLight.intensity=enclosed?1.47:.87;
      sun.color.copy(eveningLight).lerp(daylight,dayPhase);
      sun.intensity=1.05+dayPhase*1.05;
      scene.background.copy(duskColor).lerp(dayColor,.30+dayPhase*.70);
      haze.color.copy(scene.background);
    }
    if(shadows){
      // Local shadow coverage follows the player in stable four-meter steps.
      const x=indoors?0:Math.round(player.x/4)*4;
      const z=indoors?0:Math.round(player.z/4)*4;
      const signature=[x,z,Boolean(districtVisit),built,doorOpen,cityBuildingsBuilt()].join('/');
      if(signature!==shadowSignature){
        shadowSignature=signature;
        sun.target.position.set(x,0,z);
        sun.position.set(x-15,27,z+12);
        shadows.needsUpdate=true;
      }
    }
    scene.userData.townLight=enclosed||indoors?1.04:.90+dayPhase*.12;
    // Subtle first-person locomotion feedback; disabled for reduced-motion preferences.
    const moving=current.moving && player!==SEAT_POSITION;
    const sway=moving && !reduceMotion.matches ? Math.sin(now*(current.sprinting?.016:.011))*(current.sprinting?.048:.025) : 0;
    if(current.driving){
      const shape=LV_VEHICLE_TYPES[systemsState.garage?.selected||'van']||LV_VEHICLE_TYPES.van;
      const ahead=Math.min(.65,shape.length*.14),side=.30,yaw=player.yaw;
      const driverX=player.x+Math.sin(yaw)*ahead-Math.cos(yaw)*side;
      const driverZ=player.z-Math.cos(yaw)*ahead-Math.sin(yaw)*side;
      camera.position.set(driverX,Math.max(1.26,shape.roof-.24)+sway,driverZ);
    }else camera.position.set(player.x,player===SEAT_POSITION?1.46:1.7+sway,player.z);
    camera.rotation.set(player.pitch,player.yaw,0,'YXZ');
    updateCameraFeed(now);
    renderer.render(scene,camera);
    if (elapsed===1) animation=null;
    if (animation) schedule();
    else if (current.city && (current.moving || document.pointerLockElement===canvas) && !reduceMotion.matches && !renderer.isSoftware) schedule();
    else if (current.camera || current.city) wake=setTimeout(schedule,current.camera?88:renderer.isSoftware?85:50);
  }
  function schedule() {
    clearTimeout(wake);
    if(!frameId)frameId=requestAnimationFrame(render);
  }
  function update(next) {
    if(next.animate)animation={ name:next.animate,start:performance.now() };
    if(next.camera!==current?.camera)lastCamera=-100;
    current=next;
    schedule();
  }
  new ResizeObserver(schedule).observe(viewport);
  return update;
}

function drawIllustratedView(canvas, viewport) {
  viewport.dataset.renderer='illustrated';
  const ctx = canvas.getContext('2d');
  let current = null;
  if (!ctx) return () => {};
  function render() {
    if (!current) return;
    const { player, built, visitor, waiting, stock } = current;
    const map = !inOffice(player.x,player.z);
    const w = viewport.clientWidth, h = viewport.clientHeight;
    if (!w || !h) return;
    const pixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);
    canvas.width = Math.round(w * pixelRatio);
    canvas.height = Math.round(h * pixelRatio);
    ctx.setTransform(canvas.width / 430, 0, 0, canvas.height / 450, 0, 0);
    const sky = ctx.createLinearGradient(0,0,0,360);
    sky.addColorStop(0, '#b8d3cd');sky.addColorStop(.66, '#d9dcc0');sky.addColorStop(1, '#879d67');
    ctx.fillStyle = sky;ctx.fillRect(0,0,430,450);
    function poly(points,color) {
      ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));
      ctx.closePath();ctx.fillStyle=color;ctx.fill();
    }
    function rect(x,y,w,h,color) { ctx.fillStyle=color;ctx.fillRect(x,y,w,h); }
    for (let ridge = 0; ridge < 3; ridge++) {
      const points = Array.from({length:30},(_,i) => [
        i * 16, 130 + ridge * 33 + Math.sin(i * .56 + ridge) * 22 + Math.cos(i * .47 + ridge) * 15,
      ]);
      poly([...points,[464,450],[0,450]], ['#a3b49b','#859c76','#718c61'][ridge]);
    }
    poly([[0,252],[111,190],[212,198],[302,219],[430,188],[430,213],[309,252],[223,221],[126,228],[0,297]],'#83aaa0');
    poly([[0,351],[81,276],[186,250],[293,250],[430,266],[430,305],[282,267],[197,270],[98,299],[0,406]], '#c0ac7e');
    for (let i = 0; i < 23; i++) {
      const x = (i * 63.43) % 434, y = 170 + Math.sin(i * 2.5) * 21;
      const s = i % 2 ? 17 : 25;
      rect(x-2,y+9,4,s,'#79684c');
      for (let a = 0; a < 3; a++) poly([[x+(a-1)*s*.55,y-s*.60],[x-s*.89+a*s*.51,y+s*.69],[x+s*.87+a*s*.26,y+s*.78]], a % 2 ? '#54865b' : '#669466');
    }
    if (built) {
      poly([[75,290],[161,267],[230,291],[144,320]], '#8c6548');
      poly([[81,252],[151,228],[202,252],[134,276]], '#7eab79');
      poly([[134,276],[202,252],[200,269],[135,291]], '#527b58');
      for (const [x,y] of [[82,254],[135,276],[200,254]]) rect(x,y,5,42,'#82674a');
      poly([[85,293],[135,308],[199,282],[152,273]],'#b38962');
    }
    if (map) {
      poly([[254,313],[309,293],[342,308],[285,333]], '#ae865e');
      poly([[250,313],[284,279],[333,267],[346,307],[284,325]], '#5d7b5c');
      const x=215+player.x*3.9, y=342+player.z*3.4;
      poly([[x+Math.sin(-player.yaw)*7,y-Math.cos(player.yaw)*7],[x-5,y+6],[x+5,y+6]],'#213e31');
      return;
    }
    ctx.translate((player.x-.32)*-12+Math.sin(player.yaw)*13,(player.z-2.2)*-6);
    rect(0,0,430,25,'#ab936d');
    rect(0,0,16,450,'#b7a37c');
    rect(17,243,413,207,'#ae9165');
    rect(16,244,414,8,'#7a6d4f');
    rect(102,24,9,231,'#6b8261');
    rect(215,24,9,231,'#6b8261');
    rect(328,24,102,250,'#b19c71');
    rect(327,24,7,220,'#6b8261');
    rect(16,123,311,7,'#6b8261');
    rect(344,55,72,210,'#8e6e4d');
    rect(354,69,52,83,'#b39568');
    rect(354,166,52,81,'#a48356');
    if (visitor||waiting) {
      rect(367,184,26,63,{rose:'#b1766e',amber:'#b68b57',blue:'#59838b'}[visitor||waiting]);
      ctx.beginPath();ctx.ellipse(380,170,12,14,0,0,Math.PI*2);ctx.fillStyle='#c88f65';ctx.fill();
    }
    poly([[37,313],[330,290],[417,333],[105,362]], '#a78560');
    poly([[105,362],[417,333],[415,345],[105,375]], '#866644');
    rect(172,231,99,69,'#3d574d');rect(180,237,83,54,'#a4bd9c');
    rect(185,243,72,9,'#537957');rect(189,259,60,3,'#e4e5bd');rect(189,269,51,3,'#e4e5bd');
    rect(213,299,15,20,'#526556');
    rect(199,317,45,4,'#475d4c');
    for (let i = 0; i < Math.min(stock,8); i++) {
      const x = 29 + (i % 4) * 20, y = 273 - Math.floor(i / 4) * 13;
      rect(x,y,16,13,'#d3b888');rect(x+4,y+4,8,4,'#f9e6b6');
    }
  }
  new ResizeObserver(render).observe(viewport);
  return state => {
    current=state;
    render();
    const target = state.camera ? document.getElementById('security-feed') : null;
    if (!target) return;
    if(target.width!==640||target.height!==360){target.width=640;target.height=360;}
    const panel=target.getContext('2d');
    if(!panel)return;
    panel.fillStyle='#233f31';panel.fillRect(0,0,640,360);
    panel.font='bold 23px system-ui';panel.fillStyle='#fff2d3';
    panel.fillText(SECURITY_CAMERAS[state.camera].name+' · Site map',27,43);
    panel.fillStyle='#829d6a';panel.fillRect(22,68,596,267);
    panel.fillStyle='#c7b58b';panel.fillRect(22,178,596,27);panel.fillRect(352,187,36,97);
    panel.fillStyle='#48644b';panel.fillRect(290,247,160,70);
    panel.fillStyle='#fff2d3';panel.font='19px system-ui';panel.fillText('Office',337,294);
    panel.fillText('Road',490,198);
    panel.fillStyle=state.built?'#517f68':'#a9b47a';
    panel.fillRect(136,108,106,58);
    panel.fillStyle=state.built?'#fff5d8':'#253a2a';
    panel.fillText(state.built?'Pickup stand':'Empty lot',128,101);
    if(state.waiting){panel.fillStyle='#e4aa63';panel.beginPath();panel.arc(373,235,9,0,Math.PI*2);panel.fill();}
  };
}



function walletHistory(state) {
  let balance = 20;
  return [{ name: 'Open shop', short: 'Open', balance, delta: 0 },
    ...shopTotals(state).receipts.map(receipt => {
      balance += receipt.coins;
      const short = receipt.name.startsWith('Lina') ? 'Lina' : receipt.name.startsWith('Maya') ? 'Restock' :
        receipt.name.startsWith('Omar') ? 'Omar' : 'Stand';
      return { name: receipt.name, short, balance, delta: receipt.coins };
    })];
}

function walletChart(points) {
  const startX=53, stopX=441, baseline=157, ceiling=20, limit=80;
  const x = i => startX + i*(stopX-startX)/Math.max(points.length-1,1);
  const y = balance => baseline-(baseline-ceiling)*balance/limit;
  const path = points.map(({balance},i) => (i?'L':'M')+x(i)+' '+y(balance)).join(' ');
  const grid = [0,20,40,60,80].map(n => '<line x1="53" y1="'+y(n)+'" x2="441" y2="'+y(n)+
    '" stroke="#cbd5c2"/><text text-anchor="end" x="43" y="'+(y(n)+4)+'">'+n+'</text>').join('');
  const dots = points.map(({balance,short},i) => {
    const px=x(i), py=y(balance);
    return '<circle cx="'+px+'" cy="'+py+'" r="5" fill="#3a6b50" stroke="#fffdf3" stroke-width="2"/>'+
      '<text class="point-value" x="'+px+'" y="'+(py-11)+'" text-anchor="middle">'+balance+'</text>'+
      '<text x="'+px+'" y="178" text-anchor="middle">'+esc(short)+'</text>';
  }).join('');
  return '<div class="graph"><svg class="wallet-graph" viewBox="0 0 474 193" role="img" aria-label="Wallet balance after each transaction, in coins">'+
    grid+(points.length>1?'<path d="'+path+' L '+x(points.length-1)+' 157 L '+startX+' 157 Z" fill="#e3eddf" opacity=".65"/>'+
    '<path d="'+path+'" stroke="#406e55" stroke-width="3" fill="none"/>':'')+dots+'</svg></div>';
}
